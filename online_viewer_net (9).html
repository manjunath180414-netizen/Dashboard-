<!DOCTYPE html>
<html>
<head>
<title>HIS Academy CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#050c1f,#0b1b3a);
color:white;
}

.center-title{
text-align:center;
font-size:32px;
margin-top:15px;
color:#38bdf8;
text-shadow:0 0 15px #0ea5e9;
}

.sub,.clock{
text-align:center;
margin-top:5px;
}

.box-row{
display:flex;
justify-content:space-around;
margin:20px;
flex-wrap:wrap;
}

.stat-box,.filter-box{
background:rgba(15,30,70,0.9);
padding:15px;
border-radius:10px;
width:22%;
text-align:center;
box-shadow:0 0 15px #0ea5e9;
cursor:pointer;
margin-bottom:10px;
}

.divider{
height:4px;
width:90%;
margin:20px auto;
background:#38bdf8;
box-shadow:0 0 20px #0ea5e9;
}

.card{
width:90%;
margin:20px auto;
background:rgba(15,30,70,0.8);
border-radius:15px;
padding:20px;
box-shadow:0 0 25px #0ea5e9;
}

input{
width:100%;
padding:8px;
margin-bottom:15px;
border-radius:6px;
border:none;
}

table{
width:100%;
border-collapse:collapse;
}

th, td{
padding:10px;
text-align:left;
}

tr{
border-bottom:1px solid #1e3a8a;
}

select{
background:#0f172a;
color:white;
padding:5px;
border-radius:5px;
}

.status-glow{
padding:5px 10px;
border-radius:6px;
}

.green{background:#22cb2e;}
.red-light{background:#ef6262;}
.full-red{background:#7f1d1d;}
.full-green{background:#064e3b;}

.blink{animation:blink 1s infinite;}
@keyframes blink{50%{opacity:0.4;}}

.alert{
text-align:center;
background:red;
padding:10px;
display:none;
}

.shake{animation:shake 0.4s;}
@keyframes shake{
0%{transform:translateX(0);}
25%{transform:translateX(-5px);}
50%{transform:translateX(5px);}
75%{transform:translateX(-5px);}
100%{transform:translateX(0);}
}
</style>
</head>
<body>

<div class="center-title">HIS Academy</div>
<div class="sub">Welcome, Agent Manjunath</div>
<div class="clock" id="clock"></div>

<div class="box-row">
<div class="stat-box">
Leads Assigned Today<br><b id="assignedCount">0</b>
</div>

<div class="stat-box">
Total Leads Called<br><b id="calledCount">0</b>
</div>

<div class="stat-box">
Pending Today<br><b id="pendingCount">0</b>
</div>



<div class="box-row">
<<div class="filter-box" onclick="filterStatus('Interested')">Interested</div>

<div class="filter-box" onclick="filterStatus('Not Interested')">Not Intrested</div>

<div class="filter-box" onclick="filterStatus('Not Received')">Not Received</div>

<div class="filter-box" onclick="filterStatus('Joined')">Joined</div>

<div class="divider"></div>

<div class="alert" id="topAlert"></div>

<div class="card">

<input type="text" id="search" placeholder="Search phone number..." onkeyup="searchLead()">

<table>
<thead>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Status</th>
<th>Call Back / Amount</th>
</tr>
</thead>
<tbody id="leadTable"></tbody>
</table>

</div>

<script>

// CLOCK
function updateClock(){
let now=new Date();
document.getElementById("clock").innerHTML=
now.toDateString()+" | "+now.toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();

// LEADS
const leads=[
{name:"Rohit",phone:"9876543210"},
{name:"Sneha",phone:"9845123456"},
{name:"Arjun",phone:"9123456789"},
{name:"Priya",phone:"9867891234"},
{name:"Vinod",phone:"9988776655"},
{name:"Meera",phone:"9776655443"},
{name:"Amit",phone:"8899001122"},
{name:"Nisha",phone:"9334455667"},
{name:"Rajesh",phone:"9001122334"},
{name:"Suresh",phone:"9556677889"}
];

let followupTimers=[];

const table=document.getElementById("leadTable");

leads.forEach(lead=>{
let row=document.createElement("tr");

row.innerHTML=`
<td>${lead.name}</td>
<td>${lead.phone}</td>
<td>
<select>
<option>New</option>
<option>Interested</option>
<option>Not Interested</option>
<option>Follow up</option>
<option>Wrong Number</option>
<option>Not Received</option>
<option>Switch Off</option>
<option>Joined</option>
</select>
</td>
<td class="timer">--</td>
`;

let select=row.querySelector("select");
select.addEventListener("change",()=>handleStatus(select));

table.appendChild(row);
});
updateStats();

// STATUS LOGIC
function handleStatus(select){

let row=select.closest("tr");
let timer=row.querySelector(".timer");

row.className="";
select.className="status-glow";
timer.classList.remove("blink");
updateStats();

// INTERESTED / FOLLOW UP
if(select.value==="Interested" || select.value==="Follow up"){

select.classList.add("green");

let timeInput=prompt("Enter Call Back Time (HH:MM 24hr format)\nExample: 16:30");

if(!timeInput || !timeInput.includes(":")){
select.classList.add("shake");
select.value="New";
return;
}

let parts=timeInput.split(":");
let hours=parseInt(parts[0]);
let minutes=parseInt(parts[1]);

let now=new Date();
let target=new Date();
target.setHours(hours);
target.setMinutes(minutes);
target.setSeconds(0);

if(target<=now){
target.setDate(target.getDate()+1);
}

let diffSeconds=Math.floor((target-now)/1000);

startPreciseTimer(timer,diffSeconds);
}

// NOT INTERESTED
if(select.value==="Not Interested"){
select.classList.add("red-light");
timer.innerHTML="--";
}

// SWITCH OFF / NOT RECEIVED
if(select.value==="Switch Off" || select.value==="Not Received"){
select.classList.add("red-light");
startPreciseTimer(timer,18000);
}

// WRONG NUMBER
if(select.value==="Wrong Number"){
row.classList.add("full-red");
timer.innerHTML="--";
}

// JOINED
if(select.value==="Joined"){

let amount=prompt("Enter Amount Paid (₹):");

if(!amount){
select.classList.add("shake");
select.value="New";
return;
}

row.classList.add("full-green");
timer.innerHTML="₹ "+amount;
document.getElementById("topAlert").style.display="none";
}
}

// TIMER
function startPreciseTimer(cell,seconds){

let remaining=seconds;

let timerObj={cell:cell,remaining:remaining};
followupTimers.push(timerObj);

let interval=setInterval(()=>{

remaining--;
timerObj.remaining=remaining;

if(remaining<=0){
cell.innerHTML="00:00:00";
clearInterval(interval);
return;
}

let hrs=Math.floor(remaining/3600);
let mins=Math.floor((remaining%3600)/60);
let secs=remaining%60;

cell.innerHTML=
hrs.toString().padStart(2,"0")+":"+
mins.toString().padStart(2,"0")+":"+
secs.toString().padStart(2,"0");

if(remaining<=1800){
cell.classList.add("blink");
}

updateFollowupAlert();

},1000);
}

// ALERT
function updateFollowupAlert(){

let under30=followupTimers.filter(t=>t.remaining>0 && t.remaining<=1800);

if(under30.length>0){

let minRemaining=Math.min(...under30.map(t=>t.remaining));
let mins=Math.floor(minRemaining/60);

let alertBox=document.getElementById("topAlert");
alertBox.style.display="block";
alertBox.classList.add("blink");
alertBox.innerHTML=
under30.length+" Leads follow up in "+mins+" mins";

}else{
document.getElementById("topAlert").style.display="none";
}
}

// SEARCH
function searchLead(){
let input=document.getElementById("search").value.toLowerCase();
let rows=document.querySelectorAll("#leadTable tr");
rows.forEach(r=>{
r.style.display=r.innerText.toLowerCase().includes(input)?"":"none";
});
}

// FILTER
function filterStatus(status){
let rows=document.querySelectorAll("#leadTable tr");
rows.forEach(r=>{
r.style.display=r.innerText.includes(status)?"":"none";
});
}
function updateStats(){

let rows = document.querySelectorAll("#leadTable tr");

let assigned = rows.length;
let called = 0;
let pending = 0;

rows.forEach(row=>{
let status = row.querySelector("select").value;

if(status !== "New"){
called++;
}

if(status === "New"){
pending++;
}
});

document.getElementById("assignedCount").innerText = assigned;
document.getElementById("calledCount").innerText = called;
document.getElementById("pendingCount").innerText = pending;
}

</script>
</body>
</html>
