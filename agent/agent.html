<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HIS CRM – Agent Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0B1120] text-white min-h-screen">

  <!-- Header -->
  <header class="flex justify-between items-center p-6 border-b border-gray-800">
    <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent">
      HIS CRM – Agent Portal
    </h1>
    <div class="flex items-center gap-4">
      <span id="agentName" class="text-gray-300"></span>
      <button id="logoutBtn" class="bg-red-600 px-4 py-2 rounded-xl hover:bg-red-700">
        Logout
      </button>
    </div>
  </header>

  <!-- KPI Section -->
  <section class="grid grid-cols-2 md:grid-cols-4 gap-6 p-6">
    <div class="bg-[#111827] rounded-2xl p-4 shadow-lg">
      <h2 class="text-gray-400 text-sm">My Leads</h2>
      <p id="kpiTotal" class="text-2xl font-bold mt-2">0</p>
    </div>

    <div class="bg-[#111827] rounded-2xl p-4 shadow-lg">
      <h2 class="text-gray-400 text-sm">Follow Ups</h2>
      <p id="kpiFollow" class="text-2xl font-bold mt-2">0</p>
    </div>

    <div class="bg-[#111827] rounded-2xl p-4 shadow-lg">
      <h2 class="text-gray-400 text-sm">Joined</h2>
      <p id="kpiJoined" class="text-2xl font-bold mt-2">0</p>
    </div>

    <div class="bg-[#111827] rounded-2xl p-4 shadow-lg">
      <h2 class="text-gray-400 text-sm">My Revenue</h2>
      <p id="kpiRevenue" class="text-2xl font-bold mt-2">₹0</p>
    </div>
  </section>

  <!-- Tabs -->
  <section class="px-6">
    <div class="flex flex-wrap gap-4 mb-6">
      <button class="tabBtn bg-[#111827] px-4 py-2 rounded-xl" data-filter="ALL">All</button>
      <button class="tabBtn bg-[#111827] px-4 py-2 rounded-xl" data-filter="Follow Up">Follow Up</button>
      <button class="tabBtn bg-[#111827] px-4 py-2 rounded-xl" data-filter="Joined">Joined</button>
      <button class="tabBtn bg-[#111827] px-4 py-2 rounded-xl" data-filter="Not Interested">Not Interested</button>
      <button class="tabBtn bg-[#111827] px-4 py-2 rounded-xl" data-filter="New">Uncalled</button>
    </div>
  </section>

  <!-- Leads Table -->
  <section class="px-6 pb-10 overflow-x-auto">
    <table class="min-w-full bg-[#111827] rounded-2xl overflow-hidden">
      <thead class="bg-gray-900 text-gray-400 text-sm">
        <tr>
          <th class="p-4 text-left">Student</th>
          <th class="p-4 text-left">Phone</th>
          <th class="p-4 text-left">Status</th>
          <th class="p-4 text-left">Follow Up</th>
          <th class="p-4 text-left">Amount</th>
          <th class="p-4 text-left">Action</th>
        </tr>
      </thead>
      <tbody id="leadsTable" class="text-sm"></tbody>
    </table>
  </section>

  <!-- Modal -->
  <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center">
    <div class="bg-[#111827] p-6 rounded-2xl w-96">
      <h2 class="text-xl mb-4">Edit Lead</h2>

      <select id="statusInput" class="w-full mb-3 p-2 rounded bg-gray-900">
        <option>New</option>
        <option>Follow Up</option>
        <option>Joined</option>
        <option>Not Interested</option>
      </select>

      <input id="followInput" type="datetime-local" class="w-full mb-3 p-2 rounded bg-gray-900" />

      <input id="amountInput" type="number" placeholder="Amount" class="w-full mb-3 p-2 rounded bg-gray-900" />

      <textarea id="remarksInput" placeholder="Remarks" class="w-full mb-3 p-2 rounded bg-gray-900"></textarea>

      <div class="flex justify-end gap-4">
        <button id="closeModal" class="px-4 py-2 bg-gray-600 rounded-xl">Cancel</button>
        <button id="saveLead" class="px-4 py-2 bg-cyan-600 rounded-xl">Save</button>
      </div>
    </div>
  </div>

  <script type="module" src="./agent.js"></script>
</body>
</html>
