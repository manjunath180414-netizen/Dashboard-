
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HIS Academy - Agent CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f172a;
    color:white;
}

/* HEADER */
.header{
    background:#111827;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #1f2937;
}

.header h2{
    margin:0;
    font-size:18px;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
}

th, td{
    padding:12px;
    text-align:left;
}

th{
    background:#1f2937;
}

tr{
    border-bottom:1px solid #1f2937;
}

/* STATUS COLORS */
.status-wrong{
    background:#7f1d1d;
}

.status-not{
    background:#9a3412;
}

.status-joined{
    background:#4c1d95;
}

.status-followup{
    background:#064e3b;
}

/* REMARK INPUT */
input{
    width:100%;
    padding:6px;
    border-radius:4px;
    border:none;
}

/* SELECT */
select{
    padding:5px;
    border-radius:4px;
}

</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

</head>

<body>

<div class="header">
    <h2>HIS Academy - Agent CRM</h2>
    <button onclick="logout()">Logout</button>
</div>

<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Number</th>
            <th>Status</th>
            <th>Remark</th>
        </tr>
    </thead>
    <tbody id="leadTable"></tbody>
</table>

<script src="agent.js"></script>

</body>
</html>
