<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0B1120] text-white font-sans">

<div class="flex min-h-screen">

  <!-- Sidebar -->
  <aside class="w-64 bg-[#111827] p-6 hidden md:block">
    <h2 class="text-xl font-bold bg-gradient-to-r from-cyan-500 to-purple-500 bg-clip-text text-transparent">
      CRM Agent
    </h2>
    <div class="mt-10 space-y-4 text-gray-400">
      <p>Dashboard</p>
      <p id="logoutBtn" class="cursor-pointer hover:text-white">Logout</p>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 p-6">

    <!-- KPI Section -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">

      <div class="bg-[#111827] p-5 rounded-2xl shadow-lg">
        <p class="text-gray-400 text-sm">My Total Leads</p>
        <h3 id="kpiTotal" class="text-2xl font-bold">0</h3>
      </div>

      <div class="bg-[#111827] p-5 rounded-2xl shadow-lg">
        <p class="text-gray-400 text-sm">Follow Up</p>
        <h3 id="kpiFollow" class="text-2xl font-bold">0</h3>
      </div>

      <div class="bg-[#111827] p-5 rounded-2xl shadow-lg">
        <p class="text-gray-400 text-sm">Joined</p>
        <h3 id="kpiJoined" class="text-2xl font-bold">0</h3>
      </div>

      <div class="bg-[#111827] p-5 rounded-2xl shadow-lg">
        <p class="text-gray-400 text-sm">My Revenue</p>
        <h3 id="kpiRevenue" class="text-2xl font-bold">₹0</h3>
      </div>

    </div>

    <!-- Leads Table -->
    <div class="bg-[#111827] rounded-2xl shadow-lg overflow-x-auto">
      <table class="w-full text-left">
        <thead class="text-gray-400 text-sm border-b border-gray-700">
          <tr>
            <th class="p-4">Student</th>
            <th>Phone</th>
            <th>Status</th>
            <th>Amount</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="leadsTable" class="text-sm"></tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="flex justify-end mt-4">
      <button id="loadMoreBtn" class="px-4 py-2 rounded-xl bg-gradient-to-r from-cyan-500 to-purple-500">
        Load More
      </button>
    </div>

  </main>
</div>

<!-- Edit Modal -->
<div id="editModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center">
  <div class="bg-[#111827] w-full max-w-md p-6 rounded-2xl shadow-lg">
    <h3 class="text-lg font-bold mb-4">Update Lead</h3>

    <select id="statusSelect" class="w-full mb-3 p-2 rounded bg-[#0B1120]">
      <option>New</option>
      <option>Follow Up</option>
      <option>Not Interested</option>
      <option>Joined</option>
      <option>Not Received / Switch Off</option>
      <option>Invalid / Wrong Number</option>
    </select>

    <input id="followUpInput" type="datetime-local"
      class="w-full mb-3 p-2 rounded bg-[#0B1120] hidden" />

    <input id="amountInput" type="number"
      placeholder="Enter Amount"
      class="w-full mb-3 p-2 rounded bg-[#0B1120] hidden" />

    <textarea id="remarksInput"
      placeholder="Add Remarks"
      class="w-full mb-3 p-2 rounded bg-[#0B1120]"></textarea>

    <div class="flex justify-end gap-3">
      <button id="closeModal" class="px-4 py-2 bg-gray-600 rounded-xl">Cancel</button>
      <button id="saveLeadBtn" class="px-4 py-2 bg-gradient-to-r from-cyan-500 to-purple-500 rounded-xl">
        Save
      </button>
    </div>
  </div>
</div>

<script type="module" src="./agent.js"></script>
</body>
</html>
