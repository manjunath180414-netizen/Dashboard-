<!DOCTYPE html>
<html>
<head>
  <title>Cleaner Panel</title>
  <style>
    body { font-family: Arial; background:#f4f6f9; padding:20px; }
    .header { display:flex; justify-content:space-between; }
    .card {
      background:white;
      padding:15px;
      margin-top:15px;
      border-radius:8px;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }
    button {
      padding:6px 10px;
      margin-right:5px;
      border:none;
      border-radius:5px;
      cursor:pointer;
    }
    .green { background:#28a745; color:white; }
    .red { background:#dc3545; color:white; }
  </style>
</head>
<body>

<div class="header">
  <h2>Cleaner Dashboard</h2>
  <div id="userEmail"></div>
</div>

<div id="leads"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, updateDoc, doc } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB7xfwR2gBijRnVaasu_DZKuY8gLifimH0",
  authDomain: "dashboard-bd51c.firebaseapp.com",
  projectId: "dashboard-bd51c",
  storageBucket: "dashboard-bd51c.firebasestorage.app",
  messagingSenderId: "689809644516",
  appId: "1:689809644516:web:75d6051b300983afb545f1"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {
  if (!user) return location.href="index.html";

  document.getElementById("userEmail").innerText = user.email;

  const q = query(collection(db,"leads"), where("stage","==","verification"));
  const snap = await getDocs(q);

  snap.forEach(d=>{
    const data = d.data();
    document.getElementById("leads").innerHTML += `
      <div class="card">
        <b>${data.studentName}</b><br>
        ${data.phone}<br><br>
        <button class="green" onclick="updateStage('${d.id}','info')">Verified</button>
        <button class="red" onclick="updateStage('${d.id}','closed')">Wrong</button>
      </div>
    `;
  });
});

window.updateStage = async(id,stage)=>{
  await updateDoc(doc(db,"leads",id),{
    stage:stage,
    updatedAt:new Date()
  });
  location.reload();
};

</script>
</body>
</html>
