<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HIS Academy - SPY PANEL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#f4f6f9;}
.header{
background:#111;
color:white;
padding:15px 25px;
display:flex;
justify-content:space-between;
align-items:center;
}
.container{padding:25px;}
table{
width:100%;
border-collapse:collapse;
background:white;
}
th,td{padding:12px;border-bottom:1px solid #eee;}
th{background:#f1f3f6;}
.online{color:green;font-weight:bold;}
.offline{color:red;font-weight:bold;}
</style>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>

<body>

<div class="header">
<h2>🕵️ Agent Monitoring Dashboard</h2>
<button onclick="logout()">Logout</button>
</div>

<div class="container">
<table>
<thead>
<tr>
<th>Agent</th>
<th>Calls Today</th>
<th>Total Talk Time</th>
<th>Total Real Time</th>
<th>Efficiency</th>
<th>Status</th>
<th>Last Active</th>
</tr>
</thead>
<tbody id="spyTable"></tbody>
</table>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB7xfwR2gBijRnVaasu_DZKuY8gLifimH0",
  authDomain: "dashboard-bd51c.firebaseapp.com",
  projectId: "dashboard-bd51c",
  storageBucket: "dashboard-bd51c.firebasestorage.app",
  messagingSenderId: "689809644516",
  appId: "1:689809644516:web:75d6051b300983afb545f1"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(user=>{
    if(!user){
        window.location.href="index.html";
        return;
    }
    loadSpyData();
});

function logout(){
    auth.signOut().then(()=>window.location.href="index.html");
}

function loadSpyData(){

    db.collection("users").onSnapshot(async snapshot=>{

        const table = document.getElementById("spyTable");
        table.innerHTML="";

        for(const doc of snapshot.docs){

            const agent = doc.data();
            const agentId = doc.id;

            // TODAY START
            const todayStart = new Date();
            todayStart.setHours(0,0,0,0);

            const logs = await db.collection("callLogs")
                .where("agentId","==",agentId)
                .where("statusUpdatedTime",">=",todayStart)
                .get();

            let calls = 0;
            let totalSpoken = 0;
            let totalReal = 0;

            logs.forEach(l=>{
                const d = l.data();
                calls++;
                totalSpoken += d.spokenSeconds || 0;
                totalReal += d.realTimeSeconds || 0;
            });

            const efficiency = totalReal > 0
                ? Math.round((totalSpoken / totalReal) * 100)
                : 0;

            const now = Date.now();
            const lastActive = agent.lastActive
                ? agent.lastActive.toDate().getTime()
                : 0;

            const online = (now - lastActive) < 2*60*1000;

            table.innerHTML += `
            <tr>
                <td>${agent.name || "No Name"}</td>
                <td>${calls}</td>
                <td>${formatTime(totalSpoken)}</td>
                <td>${formatTime(totalReal)}</td>
                <td>${efficiency}%</td>
                <td class="${online?'online':'offline'}">
                    ${online?'Online':'Offline'}
                </td>
                <td>
                    ${agent.lastActive ? 
                    new Date(agent.lastActive.toDate()).toLocaleTimeString()
                    : '-'}
                </td>
            </tr>
            `;
        }
    });
}

function formatTime(seconds){
    const h = Math.floor(seconds/3600);
    const m = Math.floor((seconds%3600)/60);
    const s = seconds%60;
    return `${h}h ${m}m ${s}s`;
}
</script>

</body>
</html>
