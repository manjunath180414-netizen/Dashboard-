<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Data Integrity Check</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0B1120] text-white p-6">

<h1 class="text-2xl font-bold mb-6">Duplicate & Conflict Check</h1>

<div id="summary" class="mb-6 text-lg"></div>

<div id="results" class="space-y-4"></div>

<a href="manager.html"
   class="fixed bottom-6 right-6 px-6 py-3 bg-gradient-to-r from-cyan-500 to-purple-500 rounded-xl shadow-lg">
   ← Dashboard
</a>

<script type="module">

import { db } from "./services/firebase-init.js";
import { loadAgents, getAllAgents } from "./services/userService.js";
import {
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const resultsDiv = document.getElementById("results");
const summaryDiv = document.getElementById("summary");

init();

async function init() {

  await loadAgents();
  const agents = getAllAgents();

  const q = query(
    collection(db, "leads"),
    where("deleted", "==", false)
  );

  const snapshot = await getDocs(q);

  const phoneMap = {};
  let totalLeads = 0;

  snapshot.forEach(doc => {

    const data = doc.data();
    totalLeads++;

    const phone = data.phone?.trim();
    if (!phone) return;

    if (!phoneMap[phone]) {
      phoneMap[phone] = [];
    }

    phoneMap[phone].push({
      id: doc.id,
      assignedTo: data.assignedTo,
      studentName: data.studentName
    });
  });

  let duplicateCount = 0;

  for (let phone in phoneMap) {

    if (phoneMap[phone].length > 1) {

      duplicateCount++;

      const card = document.createElement("div");
      card.className = "bg-[#111827] p-6 rounded-2xl shadow-lg";

      const entries = phoneMap[phone];

      let agentNames = entries.map(e =>
        e.assignedTo ? agents[e.assignedTo] || "Unknown" : "Unassigned"
      );

      card.innerHTML = `
        <h2 class="text-lg font-bold text-red-400">Duplicate: ${phone}</h2>
        <p>Total Entries: ${entries.length}</p>
        <p>Agents: ${[...new Set(agentNames)].join(", ")}</p>
        <div class="mt-3 text-sm text-gray-400">
          ${entries.map(e =>
            `• ${e.studentName} (Lead ID: ${e.id})`
          ).join("<br>")}
        </div>
      `;

      resultsDiv.appendChild(card);
    }
  }

  summaryDiv.innerHTML = `
    Total Leads: ${totalLeads} <br>
    Duplicate Numbers Found: ${duplicateCount}
  `;
}

</script>
</body>
</html>
