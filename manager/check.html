<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Duplicate & Conflict Check</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0B1120] text-white p-6">

<h1 class="text-2xl font-bold mb-6">Duplicate & Conflict Check</h1>

<div id="summary" class="mb-6 text-lg"></div>

<div id="results" class="space-y-6"></div>

<a href="manager.html"
   class="fixed bottom-6 right-6 px-6 py-3 bg-gradient-to-r from-cyan-500 to-purple-500 rounded-xl shadow-lg">
   ← Dashboard
</a>

<script type="module">

import { db } from "./services/firebase-init.js";
import { loadAgents, getAllAgents } from "./services/userService.js";
import {
  collection,
  query,
  where,
  getDocs,
  doc,
  updateDoc,
  writeBatch,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const resultsDiv = document.getElementById("results");
const summaryDiv = document.getElementById("summary");

init();

async function init() {

  await loadAgents();
  const agents = getAllAgents();

  const q = query(
    collection(db, "leads"),
    where("deleted", "==", false)
  );

  const snapshot = await getDocs(q);

  const phoneMap = {};
  let totalLeads = 0;

  snapshot.forEach(docSnap => {

    const data = docSnap.data();
    totalLeads++;

    const phone = data.phone?.trim();
    if (!phone) return;

    if (!phoneMap[phone]) {
      phoneMap[phone] = [];
    }

    phoneMap[phone].push({
  id: docSnap.id,
  assignedTo: data.assignedTo,
  studentName: data.studentName,
  status: data.status,
  amount: data.amount || 0,
  createdAt: data.createdAt
});

  });

  let duplicateCount = 0;

  for (let phone in phoneMap) {

    const entries = phoneMap[phone];

    if (entries.length > 1) {

      duplicateCount++;

      const card = document.createElement("div");
      card.className = "bg-[#111827] p-6 rounded-2xl shadow-lg";

      const agentNames = entries.map(e =>
        e.assignedTo ? agents[e.assignedTo] || "Unknown" : "Unassigned"
      );

      card.innerHTML = `
        <h2 class="text-lg font-bold text-red-400">
          Duplicate Number: ${phone}
        </h2>

        <p class="mt-2">Total Entries: ${entries.length}</p>
        <p>Agents: ${[...new Set(agentNames)].join(", ")}</p>

        <div class="mt-4">
          <label class="text-sm text-gray-400">
            Select Correct Agent
          </label>
          <select class="agentFixSelect bg-[#0B1120] p-2 rounded mt-1 w-full">
            <option value="">Choose Agent</option>
            ${Object.entries(agents).map(([uid, name]) =>
              `<option value="${uid}">${name}</option>`
            ).join("")}
          </select>
        </div>

        <div class="flex gap-3 mt-4">
          <button class="reassignBtn bg-cyan-600 px-4 py-2 rounded">
            Reassign All
          </button>

          <button class="deleteExtrasBtn bg-red-600 px-4 py-2 rounded">
            Keep First Only
          </button>
        </div>

        <div class="mt-4 text-sm text-gray-300 space-y-2">
  ${entries.map(e => `
    <div class="bg-[#0B1120] p-3 rounded-lg">
      <div><strong>Name:</strong> ${e.studentName}</div>
      <div><strong>Status:</strong> ${e.status}</div>
      <div><strong>Agent:</strong> ${
        e.assignedTo ? agents[e.assignedTo] || "Unknown" : "Unassigned"
      }</div>
      <div><strong>Amount:</strong> ₹${e.amount}</div>
      <div><strong>Lead ID:</strong> ${e.id}</div>
      <div><strong>Created:</strong> ${
        e.createdAt ? e.createdAt.toDate().toLocaleDateString() : "-"
      }</div>
    </div>
  `).join("")}
</div>

      resultsDiv.appendChild(card);

      // ===== Correction Logic =====

      const select = card.querySelector(".agentFixSelect");
      const reassignBtn = card.querySelector(".reassignBtn");
      const deleteBtn = card.querySelector(".deleteExtrasBtn");

      reassignBtn.onclick = async () => {

        const selectedAgent = select.value;

        if (!selectedAgent) {
          alert("Select an agent first");
          return;
        }

        const batch = writeBatch(db);

        entries.forEach(e => {
          const ref = doc(db, "leads", e.id);
          batch.update(ref, {
            assignedTo: selectedAgent,
            updatedAt: serverTimestamp()
          });
        });

        await batch.commit();
        alert("All duplicates reassigned successfully");
        location.reload();
      };

      deleteBtn.onclick = async () => {

        if (!confirm("Keep first entry and mark others deleted?"))
          return;

        const batch = writeBatch(db);

        entries.slice(1).forEach(e => {
          const ref = doc(db, "leads", e.id);
          batch.update(ref, {
            deleted: true,
            updatedAt: serverTimestamp()
          });
        });

        await batch.commit();
        alert("Duplicate entries marked deleted");
        location.reload();
      };
    }
  }

  summaryDiv.innerHTML = `
    Total Leads: ${totalLeads} <br>
    Duplicate Numbers Found: ${duplicateCount}
  `;
}

</script>
</body>
</html>
