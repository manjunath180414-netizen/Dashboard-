<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manager Portal</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-color: #0B1120;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body class="text-white font-sans">

  <!-- Mobile Overlay -->
  <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-30"></div>

  <div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside id="sidebar"
      class="bg-[#111827] w-64 transition-all duration-300 flex flex-col z-40">

      <div class="flex items-center justify-between p-4 border-b border-gray-700">
        <span class="text-xl font-bold">CRM</span>
        <button id="collapseBtn" class="text-gray-400 hover:text-white">
          ☰
        </button>
      </div>

      <nav class="flex-1 p-4 space-y-3">
        <a href="#" class="flex items-center gap-3 p-3 rounded-lg bg-gradient-to-r from-cyan-500 to-purple-500">
          <span>📊</span>
          <span class="sidebar-text">Dashboard</span>
        </a>
        <a href="#" class="flex items-center gap-3 p-3 hover:bg-gray-700 rounded-lg">
          <span>📋</span>
          <span class="sidebar-text">Leads</span>
        </a>
        <a href="#" class="flex items-center gap-3 p-3 hover:bg-gray-700 rounded-lg">
          <span>👥</span>
          <span class="sidebar-text">Agents</span>
        </a>
        <a href="#" class="flex items-center gap-3 p-3 hover:bg-gray-700 rounded-lg">
          <span>⚙</span>
          <span class="sidebar-text">Settings</span>
        </a>
      </nav>
    </aside>

    <!-- Main -->
    <div class="flex-1 flex flex-col overflow-hidden">

      <!-- Topbar -->
      <header class="bg-[#111827] p-4 flex justify-between items-center border-b border-gray-700">
        <button id="mobileMenuBtn" class="md:hidden text-xl">☰</button>
        <h1 class="text-lg font-semibold">Manager Portal</h1>

        <div class="flex items-center gap-4">
          <span class="bg-purple-600 px-3 py-1 rounded-full text-sm">Manager</span>
          <span id="managerName">Manjunath</span>
        </div>
      </header>

      <!-- Content -->
      <main class="flex-1 overflow-y-auto p-6 space-y-6">

        
      <!-- Add lead -->
        <div class="flex justify-end">
  <button id="openLeadModal"
    class="bg-gradient-to-r from-cyan-500 to-purple-500 px-5 py-2 rounded-xl shadow-lg">
    + Add Lead
  </button>
</div>

        <button id="importLeadsBtn">Import Leads</button>
<input type="file" id="fileInput" class="hidden" />

<input type="file"
  id="fileInput"
  accept=".csv, .xlsx"
  class="hidden" />

        
        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
          <div class="bg-[#111827] p-6 rounded-2xl shadow-lg">
            <p class="text-gray-400">Total Leads</p>
            <h2 id="totalLeads" class="text-2xl font-bold mt-2">0</h2>
          </div>

          <div class="bg-[#111827] p-6 rounded-2xl shadow-lg">
            <p class="text-gray-400">Leads Called </p>
            <h2 id="newToday" class="text-2xl font-bold mt-2">0</h2>
          </div>

          <div class="bg-[#111827] p-6 rounded-2xl shadow-lg">
            <p class="text-gray-400">Joined</p>
            <h2 id="joinedCount" class="text-2xl font-bold mt-2">0</h2>
          </div>

          <div class="bg-[#111827] p-6 rounded-2xl shadow-lg">
            <p class="text-gray-400">Revenue</p>
            <h2 id="revenueCount" class="text-2xl font-bold mt-2">₹0</h2>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="bg-[#111827] p-4 rounded-2xl flex flex-col md:flex-row gap-4">
          <input type="text" placeholder="Search by name or phone"
            class="flex-1 bg-[#0B1120] border border-gray-700 p-2 rounded-lg focus:outline-none" />

          <select class="bg-[#0B1120] border border-gray-700 p-2 rounded-lg">
            <option>Status</option>
          </select>

          <select class="bg-[#0B1120] border border-gray-700 p-2 rounded-lg">
            <option>Agent</option>
          </select>

          <button class="bg-gradient-to-r from-cyan-500 to-purple-500 px-4 py-2 rounded-lg">
            Reset
          </button>
        </div>
<!-- Bulk Assign Bar -->
<div id="bulkBar"
  class="hidden bg-[#111827] p-4 rounded-2xl flex justify-between items-center">


  <span id="selectedCount">0 Selected</span>

  <div class="flex gap-3">
    <select id="bulkAgent"
      class="bg-[#0B1120] border border-gray-700 p-2 rounded-lg">
      <option value="">Select Agent</option>
    </select>

    <button id="bulkAssignBtn"
      class="bg-gradient-to-r from-cyan-500 to-purple-500 px-4 py-2 rounded-lg">
      Assign
    </button>
  </div>
</div>

        <!-- Leads Table -->
        <div class="bg-[#111827] rounded-2xl overflow-x-auto">
          <table class="w-full text-left">
            <thead class="border-b border-gray-700 text-gray-400">
              <tr>
                <th class="p-4">☑</th>
                <th class="p-4">Student</th>
                <th class="p-4">Phone</th>
                <th class="p-4">Status</th>
                <th class="p-4">Agent</th>
                <th class="p-4">Amount</th>
                <th class="p-4">FollowUp</th>
                <th class="p-4">Created</th>
                <th class="p-4">⋮</th>
              </tr>
            </thead>
            <tbody id="leadTableBody">
              <!-- JS Will Render Rows -->
            </tbody>
          </table>
        </div>

        <!-- Pagination -->
        <div class="flex justify-end gap-4">
          <button class="bg-gray-700 px-4 py-2 rounded-lg">Previous</button>
          <button class="bg-gray-700 px-4 py-2 rounded-lg">Next</button>
        </div>

      </main>
    </div>
  </div>


  <!-- Add Lead Modal -->
<div id="leadModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">

  <div class="bg-[#111827] w-full max-w-lg p-6 rounded-2xl shadow-xl">

    <h2 class="text-xl font-semibold mb-4">Add New Lead</h2>

    <div class="space-y-4">

      <input id="leadStudentName" type="text"
        placeholder="Student Name"
        class="w-full bg-[#0B1120] border border-gray-700 p-3 rounded-lg" />

      <input id="leadPhone" type="text"
        placeholder="Phone Number"
        class="w-full bg-[#0B1120] border border-gray-700 p-3 rounded-lg" />

      <select id="leadAgent"
        class="w-full bg-[#0B1120] border border-gray-700 p-3 rounded-lg">
        <option value="">Unassigned</option>
      </select>

    </div>

    <div class="flex justify-end gap-3 mt-6">
      <button id="closeLeadModal"
        class="px-4 py-2 bg-gray-600 rounded-lg">
        Cancel
      </button>

      <button id="saveLead"
        class="px-4 py-2 bg-gradient-to-r from-cyan-500 to-purple-500 rounded-lg">
        Save
      </button>
    </div>

  </div>
</div>
<!-- Lead Detail Modal -->
<div id="detailModal"
  class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">

  <div class="bg-[#111827] w-full max-w-2xl p-6 rounded-2xl shadow-xl overflow-y-auto max-h-[90vh]">

    <h2 class="text-xl font-semibold mb-4">Lead Details</h2>

    <div class="space-y-4">

      <div>
        <label class="text-gray-400 text-sm">Student Name</label>
        <p id="detailStudent" class="mt-1"></p>
      </div>

      <div>
        <label class="text-gray-400 text-sm">Phone</label>
        <p id="detailPhone" class="mt-1"></p>
      </div>

      <div>
        <label class="text-gray-400 text-sm">Status</label>
        <select id="detailStatus"
          class="w-full bg-[#0B1120] border border-gray-700 p-3 rounded-lg mt-1">
          <option>New</option>
          <option>Follow Up</option>
          <option>Not Interested</option>
          <option>Joined</option>
          <option>Not Received / Switch Off</option>
          <option>Invalid / Wrong Number</option>
        </select>
      </div>

      <div id="followUpContainer" class="hidden">
        <label class="text-gray-400 text-sm">Follow Up Time</label>
        <input id="detailFollowUp"
          type="datetime-local"
          class="w-full bg-[#0B1120] border border-gray-700 p-3 rounded-lg mt-1" />
      </div>

      <div id="amountContainer" class="hidden">
        <label class="text-gray-400 text-sm">Amount</label>
        <input id="detailAmount"
          type="number"
          placeholder="Enter amount"
          class="w-full bg-[#0B1120] border border-gray-700 p-3 rounded-lg mt-1" />
      </div>

      <div>
        <label class="text-gray-400 text-sm">Remarks</label>
        <textarea id="detailRemarks"
          class="w-full bg-[#0B1120] border border-gray-700 p-3 rounded-lg mt-1"></textarea>
      </div>

      <button id="saveDetail"
        class="w-full bg-gradient-to-r from-cyan-500 to-purple-500 py-3 rounded-lg">
        Save Changes
      </button>

      <hr class="border-gray-700 my-4">

      <h3 class="font-semibold">Activity History</h3>
      <div id="historyContainer" class="space-y-2 text-sm text-gray-300"></div>

    </div>

    <div class="flex justify-end mt-4">
      <button id="closeDetailModal"
        class="px-4 py-2 bg-gray-600 rounded-lg">
        Close
      </button>
    </div>

  </div>
</div>
<!-- Import Assign Modal -->
<div id="importAssignModal"
  class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">

  <div class="bg-[#111827] p-6 rounded-2xl w-full max-w-md">

    <h2 class="text-lg font-semibold mb-4">Assign Imported Leads</h2>

    <div class="space-y-4">

      <label class="flex items-center gap-2">
        <input type="radio" name="assignOption" value="no" checked />
        Do not assign (Keep Unassigned)
      </label>

      <label class="flex items-center gap-2">
        <input type="radio" name="assignOption" value="yes" />
        Assign to Agent
      </label>

      <select id="importAgentSelect"
        class="w-full bg-[#0B1120] border border-gray-700 p-2 rounded-lg hidden">
      </select>

    </div>

    <div class="flex justify-end gap-3 mt-6">
      <button id="cancelImport"
        class="px-4 py-2 bg-gray-600 rounded-lg">
        Cancel
      </button>

      <button id="confirmImport"
        class="px-4 py-2 bg-gradient-to-r from-cyan-500 to-purple-500 rounded-lg">
        Import
      </button>
    </div>

  </div>
</div>

<script type="module" src="manager.js"></script>

</body>
</html>
