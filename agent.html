<!DOCTYPE html>
<html>
<head>
  <title>HIS Academy - Agent Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    body{
      margin:0;
      font-family:'Segoe UI', sans-serif;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
    }

    .container{
      padding:20px;
    }

    .header{
      margin-bottom:25px;
    }

    .header h1{
      margin:0;
      font-size:22px;
      font-weight:600;
    }

    .welcome{
      margin-top:6px;
      font-size:14px;
      color:#94a3b8;
    }

    .stats-row{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin-bottom:18px;
    }

    .stats-row-4{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
    }

    .card{
      background:rgba(255,255,255,0.05);
      backdrop-filter:blur(12px);
      border-radius:16px;
      padding:18px;
      text-align:center;
      box-shadow:0 4px 20px rgba(0,0,0,0.4);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-3px);
    }

    .card h2{
      margin:0;
      font-size:22px;
      font-weight:700;
    }

    .card p{
      margin:5px 0 0 0;
      font-size:12px;
      color:#cbd5e1;
    }
.lead-card{
background:rgba(255,255,255,0.04);
border-radius:14px;
padding:14px;
margin-bottom:14px;
box-shadow:0 0 20px rgba(255,255,255,0.03);
transition:0.3s;
}

.lead-card:hover{
box-shadow:0 0 25px rgba(255,255,255,0.06);
}

.lead-row-top{
display:flex;
justify-content:space-between;
align-items:center;
font-weight:600;
}

.lead-phone{
color:#22c55e;
cursor:pointer;
font-weight:500;
}

.lead-row-bottom{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:10px;
gap:10px;
flex-wrap:wrap;
}

.status-select{
background:#1e293b;
color:white;
border:1px solid #334155;
border-radius:8px;
padding:6px;
}

.notes-input{
flex:1;
background:#1e293b;
color:white;
border:1px solid #334155;
border-radius:8px;
padding:6px;
font-size:12px;
}

.followup-time{
background:#1e293b;
color:white;
border:1px solid #334155;
border-radius:8px;
padding:6px;
}

.glow-green{
border:1px solid #22c55e;
}

.glow-red{
border:1px solid #ef4444;
animation:blink 1s infinite;
}

@keyframes blink{
0%{opacity:1;}
50%{opacity:0.7;}
100%{opacity:1;}
}

  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>HIS Academy</h1>
    <div class="welcome" id="welcomeText">Welcome</div>
  </div>

  <!-- ROW 1: Today Summary -->
  <div class="stats-row">
    <div class="card">
      <h2 id="assignedToday">0</h2>
      <p>Assigned Today</p>
    </div>

    <div class="card">
      <h2 id="calledToday">0</h2>
      <p>Called Today</p>
    </div>

    <div class="card">
      <h2 id="pendingToday">0</h2>
      <p>Pending Today</p>
    </div>
  </div>

  <!-- ROW 2: Status Summary -->
  <div class="stats-row-4">
    <div class="card">
      <h2 id="interestedCount">0</h2>
      <p>Interested</p>
    </div>

    <div class="card">
      <h2 id="notInterestedCount">0</h2>
      <p>Not Interested</p>
    </div>

    <div class="card">
      <h2 id="followUpCount">0</h2>
      <p>Follow Up</p>
    </div>

    <div class="card">
      <h2 id="joinedCount">0</h2>
      <p>Joined</p>
    </div>
  </div>

</div>
<hr style="border:none;border-top:1px solid rgba(255,255,255,0.1);margin:25px 0;">

<h3 style="margin-bottom:15px;">Leads</h3>

<div id="leadsContainer"></div>

<div id="copyToast" style="
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#22c55e;
color:white;
padding:6px 12px;
border-radius:20px;
font-size:12px;
display:none;">
Number copied
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyB7xfwR2gBijRnVaasu_DZKuY8gLifimH0",
  authDomain: "dashboard-bd51c.firebaseapp.com",
  projectId: "dashboard-bd51c",
  storageBucket: "dashboard-bd51c.firebasestorage.app",
  messagingSenderId: "689809644516",
  appId: "1:689809644516:web:75d6051b300983afb545f1"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(user=>{
  if(!user){
    window.location.href="index.html";
  } else {
    document.getElementById("welcomeText").innerText =
      "Welcome, " + user.displayName;

    loadStats(user.uid);
  }
});

function loadStats(uid){

  db.collection("leads")
  .where("assignedTo","==",uid)
  .onSnapshot(snapshot=>{

    let assignedToday = 0;
    let calledToday = 0;
    let pendingToday = 0;

    let interested = 0;
    let notInterested = 0;
    let followUp = 0;
    let joined = 0;

    const today = new Date();
    today.setHours(0,0,0,0);

    snapshot.forEach(doc=>{
      const data = doc.data();

      // Assigned Today
      if(data.createdAt && data.createdAt.toDate){
        const created = data.createdAt.toDate();
        if(created >= today) assignedToday++;
      }

      // Called Today (if updated today)
      if(data.updatedAt){
        const updated = new Date(data.updatedAt);
        if(updated >= today) calledToday++;
      }

      // Pending
      if(!data.status || data.status === "New") pendingToday++;

      // Status counts
      if(data.status === "Interested") interested++;
      if(data.status === "Not Interested") notInterested++;
      if(data.status === "Follow Up") followUp++;
      if(data.status === "Joined") joined++;
    });

    document.getElementById("assignedToday").innerText = assignedToday;
    document.getElementById("calledToday").innerText = calledToday;
    document.getElementById("pendingToday").innerText = pendingToday;

    document.getElementById("interestedCount").innerText = interested;
    document.getElementById("notInterestedCount").innerText = notInterested;
    document.getElementById("followUpCount").innerText = followUp;
    document.getElementById("joinedCount").innerText = joined;

  });
}
function loadLeadsSection(uid){

db.collection("leads")
.where("assignedTo","==",uid)
.onSnapshot(snapshot=>{

let html="";

snapshot.forEach(doc=>{
const data=doc.data();
let cardClass="lead-card";

if(data.status==="Interested"){
cardClass+=" glow-green";
}

if(data.status==="Follow Up" && data.followUpTime){
let diff=data.followUpTime - new Date().getTime();
if(diff<=1800000 && diff>0){
cardClass+=" glow-red";
}
}

html+=`
<div class="${cardClass}">
<div class="lead-row-top">
<div>
${data.studentName}
</div>
<div class="lead-phone" onclick="copyNumber('${data.phone}')">
${data.phone}
</div>
</div>

<div class="lead-row-bottom">

<select class="status-select"
onchange="updateStatus('${doc.id}',this.value)">
<option ${data.status==="New"?"selected":""}>New</option>
<option ${data.status==="Interested"?"selected":""}>Interested</option>
<option ${data.status==="Not Interested"?"selected":""}>Not Interested</option>
<option ${data.status==="Switched Off"?"selected":""}>Switched Off</option>
<option ${data.status==="Wrong Number"?"selected":""}>Wrong Number</option>
</select>

${data.status==="Interested" ? `
<input type="time" class="followup-time"
value="${data.followUpDisplay || ''}"
onchange="setFollowUp('${doc.id}',this.value)">
` : ``}

<input type="text"
class="notes-input"
placeholder="Notes"
value="${data.notes || ''}"
oninput="autoSaveNote('${doc.id}',this.value)">

</div>
</div>
`;
});

document.getElementById("leadsContainer").innerHTML=html;

});
}

function updateStatus(id,status){

let updateData={
status:status,
updatedAt:new Date()
};

if(status==="Switched Off"){
updateData.followUpTime=new Date().getTime() + 8*60*60*1000;
}

db.collection("leads").doc(id).update(updateData);
}

function setFollowUp(id,timeValue){

if(!timeValue) return;

let now=new Date();
let parts=timeValue.split(":");
now.setHours(parts[0]);
now.setMinutes(parts[1]);
let timestamp=now.getTime();

db.collection("leads").doc(id).update({
status:"Follow Up",
followUpTime:timestamp,
followUpDisplay:timeValue,
updatedAt:new Date()
});
}

function autoSaveNote(id,value){
db.collection("leads").doc(id).update({
notes:value,
updatedAt:new Date()
});
}

function copyNumber(phone){
navigator.clipboard.writeText(phone);
let toast=document.getElementById("copyToast");
toast.style.display="block";
setTimeout(()=>{toast.style.display="none";},1200);
}

</script>

</body>
</html>
