<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HIS Academy - Agent Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f6f9;
}

/* HEADER */
.header{
    background:linear-gradient(90deg,#1e3c72,#2a5298);
    color:white;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h2{
    margin:0;
}

.header button{
    background:white;
    border:none;
    padding:8px 15px;
    border-radius:6px;
    cursor:pointer;
}

/* CONTAINER */
.container{
    padding:30px;
}

/* WELCOME */
.welcome{
    font-size:22px;
    margin-bottom:25px;
    color:#333;
}

/* STAT CARDS */
.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.stat-card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.05);
    text-align:center;
}

.stat-card h4{
    margin:0;
    font-weight:normal;
    color:#555;
}

.stat-card h2{
    margin:10px 0 0 0;
}

/* Colored numbers */
.blue{ color:#2a5298; }
.green{ color:#2ecc71; }
.red{ color:#e74c3c; }
.orange{ color:#f39c12; }
.gray{ color:#7f8c8d; }

/* FILTER ROW */
.filter-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

.filter-row input{
    padding:8px;
    width:250px;
    border-radius:6px;
    border:1px solid #ccc;
}

.filter-row select{
    padding:8px;
    border-radius:6px;
    border:1px solid #ccc;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

th,td{
    padding:12px;
    text-align:left;
}

th{
    background:#f1f3f6;
}

tr:nth-child(even){
    background:#fafafa;
}

/* STATUS BADGES */
.badge{
    padding:6px 12px;
    border-radius:20px;
    color:white;
    font-size:13px;
}

.badge-new{ background:#3498db; }
.badge-interested{ background:#2ecc71; }
.badge-not{ background:#e74c3c; }
.badge-call{ background:#f39c12; }
.badge-switch{ background:#7f8c8d; }
.badge-joined{ background:#8e44ad; }

/* REMARK INPUT */
.remark-input{
    width:100%;
    padding:5px;
    border-radius:5px;
    border:1px solid #ccc;
}

</style>
</head>

<body>

<div class="header">
    <h2>HIS Academy - Agent Portal</h2>
    <div>
        Welcome, <b id="agentName">Agent</b>
        <button>Logout</button>
    </div>
</div>

<div class="container">

    <div class="welcome">
        Welcome to HIS Academy CRM
    </div>

    <!-- STATS -->
    <div class="stats">
        <div class="stat-card">
            <h4>Total Leads</h4>
            <h2 class="blue" id="totalLeads">0</h2>
        </div>
        <div class="stat-card">
            <h4>Interested</h4>
            <h2 class="green" id="totalInterested">0</h2>
        </div>
        <div class="stat-card">
            <h4>Not Interested</h4>
            <h2 class="red" id="totalNotInterested">0</h2>
        </div>
        <div class="stat-card">
            <h4>Call Back</h4>
            <h2 class="orange" id="totalCall">0</h2>
        </div>
        <div class="stat-card">
            <h4>Switch Off</h4>
            <h2 class="gray" id="totalSwitch">0</h2>
        </div>
    </div>

    <!-- FILTER -->
    <div class="filter-row">
        <select>
            <option>All</option>
            <option>Interested</option>
            <option>Not Interested</option>
            <option>Call Back</option>
            <option>Switch Off</option>
            <option>Joined</option>
        </select>

        <input type="text" placeholder="Search leads...">
    </div>

    <!-- TABLE -->
    <table>
        <thead>
            <tr>
                <th>Lead Name</th>
                <th>Phone</th>
                <th>Status</th>
                <th>Follow Up</th>
                <th>Amount</th>
                <th>Remark</th>
            </tr>
        </thead>
        <tbody id="leadTable">

            <!-- SAMPLE ROW -->
            <tr>
                <td>Rajesh Kumar</td>
                <td>9876543210</td>
                <td><span class="badge badge-interested">Interested</span></td>
                <td>-</td>
                <td>0</td>
                <td><input class="remark-input" placeholder="Write remark..."></td>
            </tr>

        </tbody>
    </table>

</div>

</body>
</html>
