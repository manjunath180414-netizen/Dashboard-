<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIS Academy - Agent Dashboard</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>

body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
}

header{
padding:18px;
background:rgba(30,41,59,0.9);
position:sticky;
top:0;
z-index:10;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
padding:15px;
}

.card{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(12px);
border-radius:16px;
padding:15px;
margin-bottom:18px;
transition:0.3s;
box-shadow:0 4px 20px rgba(0,0,0,0.4);
}

.card-header{
display:flex;
justify-content:space-between;
align-items:center;
}

.phone{
color:#22c55e;
cursor:pointer;
font-weight:bold;
}

.status-badge{
padding:5px 10px;
border-radius:20px;
font-size:12px;
background:#334155;
}

.dropdown{
margin-top:10px;
width:100%;
padding:8px;
border-radius:8px;
border:none;
}

.expand{
margin-top:10px;
}

textarea,input{
width:100%;
padding:8px;
border-radius:8px;
border:none;
margin-top:8px;
}

button{
margin-top:8px;
padding:8px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
cursor:pointer;
}

.green-border{border:2px solid #22c55e;}
.red-blink{
border:2px solid #ef4444;
animation:blink 1s infinite;
}

@keyframes blink{
0%{opacity:1;}
50%{opacity:0.6;}
100%{opacity:1;}
}

.toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#22c55e;
padding:8px 15px;
border-radius:20px;
display:none;
}

</style>
</head>

<body>

<header>
<div>
<b>HIS Academy</b><br>
<span id="welcome"></span>
</div>
<button onclick="logout()">Logout</button>
</header>

<div class="container" id="leadContainer"></div>

<div class="toast" id="toast">Number Copied</div>

<script>

const firebaseConfig = {
apiKey: "AIzaSyB7xfwR2gBijRnVaasu_DZKuY8gLifimH0",
authDomain: "dashboard-bd51c.firebaseapp.com",
projectId: "dashboard-bd51c",
storageBucket: "dashboard-bd51c.firebasestorage.app",
messagingSenderId: "689809644516",
appId: "1:689809644516:web:75d6051b300983afb545f1"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUID="";

auth.onAuthStateChanged(user=>{
if(!user){ window.location.href="index.html"; }
else{
currentUID=user.uid;
document.getElementById("welcome").innerText="Agent Dashboard - Welcome, "+user.displayName;
loadLeads();
}
});

function loadLeads(){
db.collection("leads")
.where("assignedTo","==",currentUID)
.onSnapshot(snapshot=>{
let html="";

snapshot.forEach(doc=>{
const data=doc.data();
let cardClass="card";

if(data.status==="Interested") cardClass+=" green-border";

if(data.followUpTime){
let diff=data.followUpTime - new Date().getTime();
if(diff<=1800000 && diff>0) cardClass+=" red-blink";
}

html+=`
<div class="${cardClass}">
<div class="card-header">
<div>
<b>${data.studentName}</b><br>
<span class="phone" onclick="copyPhone('${data.phone}')">${data.phone}</span>
</div>
<span class="status-badge">${data.status || "New"}</span>
</div>

<select class="dropdown" onchange="changeStatus('${doc.id}',this.value)">
<option value="">Select Status</option>
<option>Interested</option>
<option>Not Interested</option>
<option>Follow Up</option>
<option>Joined</option>
<option>Wrong Number</option>
<option>Switched Off</option>
</select>

<div class="expand" id="expand-${doc.id}"></div>

${data.amount ? "<div>Amount: ₹"+data.amount+"</div>" : ""}

</div>
`;
});

document.getElementById("leadContainer").innerHTML=html;
});
}

function changeStatus(id,status){

let expand=document.getElementById("expand-"+id);
expand.innerHTML="";

if(status==="Interested"){
expand.innerHTML=`<textarea placeholder="Reason"></textarea>
<button onclick="saveStatus('${id}','Interested',this)">Save</button>`;
}

if(status==="Not Interested"){
expand.innerHTML=`<textarea placeholder="Reason (Required)"></textarea>
<button onclick="saveStatus('${id}','Not Interested',this)">Submit</button>`;
}

if(status==="Follow Up"){
expand.innerHTML=`<input type="time" id="time-${id}">
<button onclick="saveFollowUp('${id}')">Set Follow Up</button>`;
}

if(status==="Switched Off"){
let time=new Date().getTime()+8*60*60*1000;
db.collection("leads").doc(id).update({
status:"Switched Off",
followUpTime:time
});
}

if(status==="Joined"){
expand.innerHTML=`<input type="number" id="amt-${id}" placeholder="Enter Amount">
<button onclick="saveJoined('${id}')">Save</button>`;
}

if(status==="Wrong Number"){
expand.innerHTML=`<button onclick="removeLead('${id}')">Submit</button>`;
}
}

function saveStatus(id,status,btn){
let reason=btn.previousElementSibling.value;
db.collection("leads").doc(id).update({
status:status,
notes:reason,
updatedAt:new Date()
});
}

function saveFollowUp(id){
let t=document.getElementById("time-"+id).value;
if(!t) return;

let now=new Date();
let parts=t.split(":");
now.setHours(parts[0]);
now.setMinutes(parts[1]);
let time=now.getTime();

db.collection("leads").doc(id).update({
status:"Follow Up",
followUpTime:time,
updatedAt:new Date()
});
}

function saveJoined(id){
let amt=document.getElementById("amt-"+id).value;
if(!amt) return;

db.collection("leads").doc(id).update({
status:"Joined",
amount:parseInt(amt),
updatedAt:new Date()
});
}

function removeLead(id){
db.collection("leads").doc(id).update({
status:"Wrong Number",
assignedTo:null
});
}

function copyPhone(phone){
navigator.clipboard.writeText(phone);
let toast=document.getElementById("toast");
toast.style.display="block";
setTimeout(()=>{toast.style.display="none";},1500);
}

function logout(){
auth.signOut().then(()=>window.location.href="index.html");
}

</script>
</body>
</html>
