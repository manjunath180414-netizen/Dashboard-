<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIS Academy - Agent Dashboard</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
}

.container{padding:20px;}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.slogan{
font-size:18px;
font-weight:600;
}

.date{
font-size:12px;
color:#94a3b8;
}

.welcome{
margin-bottom:20px;
color:#cbd5e1;
}

.date-filter{
background:#1e293b;
border:none;
color:white;
padding:6px;
border-radius:8px;
cursor:pointer;
}

.box-row{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-bottom:12px;
}

.box-row-4{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-bottom:20px;
}

.box{
background:rgba(59,130,246,0.15);
border:1px solid rgba(59,130,246,0.4);
border-radius:14px;
padding:15px;
text-align:center;
cursor:pointer;
transition:0.3s;
}

.box.active{
background:rgba(59,130,246,0.35);
box-shadow:0 0 20px rgba(59,130,246,0.6);
}

.box h2{
margin:0;
font-size:20px;
}

.box p{
margin:4px 0 0;
font-size:12px;
}

.lead-card{
border-radius:14px;
margin-bottom:12px;
overflow:hidden;
transition:0.3s;
}

.lead-main{
display:flex;
justify-content:space-between;
padding:14px;
font-weight:600;
cursor:pointer;
background:rgba(255,255,255,0.05);
}

.lead-expand{
display:none;
padding:12px;
background:rgba(0,0,0,0.25);
}

.strong-green{
background:linear-gradient(90deg,rgba(34,197,94,0.35),rgba(34,197,94,0.15));
}

.strong-teal{
background:linear-gradient(90deg,rgba(20,184,166,0.35),rgba(20,184,166,0.15));
}

.strong-orange{
background:linear-gradient(90deg,rgba(245,158,11,0.35),rgba(245,158,11,0.15));
}

.strong-red{
background:linear-gradient(90deg,rgba(239,68,68,0.45),rgba(239,68,68,0.25));
}

.blink-border{
box-shadow:0 0 20px red;
animation:blink 1s infinite;
}


@keyframes blink{
0%{opacity:1;}
50%{opacity:0.7;}
100%{opacity:1;}
}

.top-row{
display:flex;
justify-content:space-between;
font-weight:600;
}

.phone{
color:#22c55e;
cursor:pointer;
}

select,input,textarea{
width:100%;
margin-top:8px;
padding:8px;
border-radius:8px;
border:none;
background:#1e293b;
color:white;
}

.error{
color:#f87171;
font-size:12px;
margin-top:4px;
}

.toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#22c55e;
padding:6px 12px;
border-radius:20px;
display:none;
font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div>
<div class="slogan">HIS Academy – Let us change the way students study</div>
<div class="date" id="todayDate"></div>
</div>
<input type="date" class="date-filter" id="datePicker">
</div>

<div class="welcome" id="welcomeText"></div>

<!-- 3 BOXES -->
<div class="box-row">
<div class="box" onclick="setFilter('assignedToday')" id="assignedBox">
<h2 id="assignedToday">0</h2>
<p>Assigned Today</p>
</div>
<div class="box" onclick="setFilter('calledToday')" id="calledBox">
<h2 id="calledToday">0</h2>
<p>Called Today</p>
</div>
<div class="box" onclick="setFilter('pendingToday')" id="pendingBox">
<h2 id="pendingToday">0</h2>
<p>Pending Today</p>
</div>
</div>

<!-- 4 BOXES -->
<div class="box-row-4">
<div class="box" onclick="setFilter('Interested')" id="interestedBox">
<h2 id="interestedCount">0</h2>
<p>Interested</p>
</div>
<div class="box" onclick="setFilter('Not Interested')" id="notInterestedBox">
<h2 id="notInterestedCount">0</h2>
<p>Not Interested</p>
</div>
<div class="box" onclick="setFilter('Follow Up')" id="followUpBox">
<h2 id="followUpCount">0</h2>
<p>Follow Up</p>
</div>
<div class="box" onclick="setFilter('Joined')" id="joinedBox">
<h2 id="joinedCount">0</h2>
<p>Joined</p>
</div>
</div>

<div id="leadsContainer"></div>

</div>

<div class="toast" id="toast">Number Copied</div>

<script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyB7xfwR2gBijRnVaasu_DZKuY8gLifimH0",
  authDomain: "dashboard-bd51c.firebaseapp.com",
  projectId: "dashboard-bd51c",
  storageBucket: "dashboard-bd51c.firebasestorage.app",
  messagingSenderId: "689809644516",
  appId: "1:689809644516:web:75d6051b300983afb545f1"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUID="";

auth.onAuthStateChanged(user=>{
  if(!user){
    window.location.href="index.html";
  } else {
    currentUID=user.uid;

    db.collection("users").doc(currentUID).get().then(doc=>{
      if(!doc.exists || doc.data().role!=="agent"){
        window.location.href="index.html";
      } else {
        document.querySelector(".welcome").innerText="Welcome, "+doc.data().name;
        loadLeads();
      }
    });
  }
});

function loadLeads(){

  db.collection("leads")
  .where("assignedTo","==",currentUID)
  .onSnapshot(snapshot=>{

    leadTable.innerHTML="";
    let leadsData=[];
    snapshot.forEach(doc=>{
      leadsData.push({...doc.data(), id:doc.id});
    });

    leadsData.forEach((lead,index)=>createRow(lead,index));
    updateCounts(leadsData);
  });
}

function updateCounts(leads){
let assigned=leads.length;
let called=0,pending=0,interested=0,notInterested=0,followUp=0,joined=0;

leads.forEach(l=>{
if(l.status!=="New") called++;
if(l.status==="New") pending++;
if(l.status==="Interested") interested++;
if(l.status==="Not Interested") notInterested++;
if(l.status==="Follow Up") followUp++;
if(l.status==="Joined") joined++;
});

assignedCount.innerText=assigned;
calledCount.innerText=called;
pendingCount.innerText=pending;
interestedCount.innerText=interested;
notInterestedCount.innerText=notInterested;
followUpCount.innerText=followUp;
joinedCount.innerText=joined;
}

function formatTime(seconds){
let h=Math.floor(seconds/3600);
let m=Math.floor((seconds%3600)/60);
let s=seconds%60;
return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
}

function startTimer(cell,row,targetTime){
let interval=setInterval(()=>{
let remaining=Math.floor((targetTime-Date.now())/1000);

if(remaining>0){
cell.innerHTML="Call in "+formatTime(remaining);

if(remaining<=1800){
cell.classList.add("warning");
}
}else{
cell.innerHTML="Missed Follow Up";
cell.classList.add("missed");
row.classList.add("wrong");
clearInterval(interval);
}
},1000);
}

function createRow(lead,index){

let row=document.createElement("tr");

row.innerHTML=`
<td class="status-strip"></td>
<td>${lead.studentName}</td>
<td class="phone">${lead.phone}</td>
<td>
<select>
<option ${lead.status==="New"?"selected":""}>New</option>
<option ${lead.status==="Interested"?"selected":""}>Interested</option>
<option ${lead.status==="Not Interested"?"selected":""}>Not Interested</option>
<option ${lead.status==="Follow Up"?"selected":""}>Follow Up</option>
<option ${lead.status==="Switch Off"?"selected":""}>Switch Off</option>
<option ${lead.status==="Wrong Number"?"selected":""}>Wrong Number</option>
<option ${lead.status==="Joined"?"selected":""}>Joined</option>
</select>
</td>
<td class="dynamic">${lead.amount?("₹"+lead.amount):"--"}</td>
`;

let select=row.querySelector("select");
let dynamic=row.querySelector(".dynamic");

select.addEventListener("change",function(){

row.className="";
dynamic.innerHTML="--";

let newStatus=this.value;

if(newStatus==="Interested"){
row.classList.add("interested");
}

if(newStatus==="Follow Up"){
row.classList.add("interested");
let time=prompt("Enter follow up time (HH:MM 24hr format)");
if(time){
let now=new Date();
let parts=time.split(":");
now.setHours(parts[0]);
now.setMinutes(parts[1]);
db.collection("leads").doc(lead.id).update({
status:newStatus,
followUpTime:now.getTime()
});
startTimer(dynamic,row,now.getTime());
}
return;
}

if(newStatus==="Switch Off"){
row.classList.add("switch");
let target=Date.now()+8*60*60*1000;
db.collection("leads").doc(lead.id).update({
status:newStatus,
followUpTime:target
});
startTimer(dynamic,row,target);
return;
}

if(newStatus==="Joined"){
row.classList.add("joined");
let amount=prompt("Enter Amount Paid:");
if(amount){
db.collection("leads").doc(lead.id).update({
status:newStatus,
amount:parseInt(amount)
});
dynamic.innerHTML="₹"+amount;
}
return;
}

if(newStatus==="Wrong Number"){
row.classList.add("wrong");
db.collection("leads").doc(lead.id).update({
status:newStatus
});
return;
}

db.collection("leads").doc(lead.id).update({
status:newStatus
});

});

leadTable.appendChild(row);
}

</script>




</script>
</body>
</html>
