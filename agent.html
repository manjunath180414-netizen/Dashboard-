<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HIS Academy - Agent CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
}

.header{
    padding:15px 20px;
    background:#111827;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.container{
    padding:20px;
}

select,input{
    padding:8px;
    border-radius:6px;
    border:none;
    margin-right:10px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
    background:#1e293b;
    border-radius:10px;
    overflow:hidden;
}

th,td{
    padding:12px;
    text-align:left;
}

th{
    background:#334155;
}

tr{
    transition:0.3s;
}

/* STATUS COLORS */
.row-wrong{
    background:#7f1d1d !important;
}

.row-not{
    background:#7c2d12 !important;
}

.row-joined{
    background:#4c1d95 !important;
}

.copy-number{
    cursor:pointer;
    color:#38bdf8;
}

.remark-input{
    width:100%;
    padding:6px;
    border-radius:5px;
    border:none;
}
</style>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

</head>

<body>

<div class="header">
    <h3>HIS Academy - Agent CRM</h3>
    <div>
        <input type="date" id="dateSelector">
        <button onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">

<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Number</th>
            <th>Status</th>
            <th>Remark</th>
        </tr>
    </thead>
    <tbody id="leadTable"></tbody>
</table>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB7xfwR2gBijRnVaasu_DZKuY8gLifimH0",
  authDomain: "dashboard-bd51c.firebaseapp.com",
  projectId: "dashboard-bd51c",
  storageBucket: "dashboard-bd51c.firebasestorage.app",
  messagingSenderId: "689809644516",
  appId: "1:689809644516:web:75d6051b300983afb545f1"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let agentUID = null;

auth.onAuthStateChanged(user=>{
    if(!user){
        window.location.href="index.html";
        return;
    }
    agentUID = user.uid;
    setToday();
    loadLeads();
});

function setToday(){
    const today = new Date().toISOString().split("T")[0];
    document.getElementById("dateSelector").value = today;
}

document.getElementById("dateSelector").addEventListener("change",loadLeads);

function loadLeads(){

    const selectedDate = document.getElementById("dateSelector").value;
    const start = new Date(selectedDate);
    const end = new Date(selectedDate);
    end.setHours(23,59,59,999);

    db.collection("leads")
    .where("assignedTo","==",agentUID)
    .where("createdAt",">=",start)
    .where("createdAt","<=",end)
    .where("deleted","==",false)
    .onSnapshot(snapshot=>{

        const table = document.getElementById("leadTable");
        table.innerHTML="";

        snapshot.forEach(doc=>{
            const data = doc.data();
            const rowClass = getRowClass(data.status);

            table.innerHTML += `
                <tr class="${rowClass}">
                    <td>${data.studentName}</td>
                    <td class="copy-number" onclick="copyNumber('${data.phone}')">
                        ${data.phone}
                    </td>
                    <td>
                        <select onchange="changeStatus('${doc.id}', this.value, '${data.status}')">
                            ${generateOptions(data.status)}
                        </select>
                    </td>
                    <td>
                        <input class="remark-input"
                        value="${data.remarks || ''}"
                        onchange="saveRemark('${doc.id}', this.value)">
                    </td>
                </tr>
            `;
        });

    });
}

function generateOptions(current){
    const statuses=[
        "New",
        "Called",
        "Interested",
        "Follow Up",
        "Not Interested",
        "Switch Off",
        "Wrong / Invalid",
        "Joined"
    ];

    return statuses.map(s=>
        `<option value="${s}" ${s===current?"selected":""}>${s}</option>`
    ).join("");
}

function getRowClass(status){
    if(status==="Wrong / Invalid") return "row-wrong";
    if(status==="Not Interested") return "row-not";
    if(status==="Joined") return "row-joined";
    return "";
}

function changeStatus(id,newStatus,oldStatus){

    if(newStatus==="Interested" || newStatus==="Follow Up"){
        const date = prompt("Enter followup date (YYYY-MM-DD)");
        const time = prompt("Enter followup time (HH:MM)");

        if(!date || !time){
            alert("Followup required");
            loadLeads();
            return;
        }

        const followUpTime = new Date(date+" "+time).getTime();

        db.collection("leads").doc(id).update({
            status:newStatus,
            followUpTime:followUpTime
        });

        return;
    }

    if(newStatus==="Switch Off"){
        const autoTime = Date.now() + (12*60*60*1000);

        db.collection("leads").doc(id).update({
            status:newStatus,
            followUpTime:autoTime
        });

        return;
    }

    db.collection("leads").doc(id).update({
        status:newStatus,
        followUpTime:null
    });
}

function saveRemark(id,value){
    db.collection("leads").doc(id).update({
        remarks:value
    });
}

function copyNumber(number){
    navigator.clipboard.writeText(number);
    alert("Copied");
}

function logout(){
    auth.signOut();
}
</script>

</body>
</html>
