<!DOCTYPE html>
<html>
<head>
  <title>Agent Dashboard - HIS Academy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    body{
      margin:0;
      font-family:'Segoe UI', sans-serif;
      background: linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
      min-height:100vh;
    }

    header{
      background: rgba(30,41,59,0.8);
      backdrop-filter: blur(10px);
      padding:18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom:1px solid rgba(255,255,255,0.1);
      position:sticky;
      top:0;
      z-index:10;
    }

    .title{
      font-size:18px;
      font-weight:bold;
    }

    .welcome{
      font-size:14px;
      opacity:0.8;
    }

    .container{
      padding:20px;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:15px;
      margin-bottom:25px;
    }

    .stat-box{
      background: rgba(255,255,255,0.05);
      padding:20px;
      border-radius:15px;
      text-align:center;
      cursor:pointer;
      transition:0.3s;
      box-shadow:0 4px 20px rgba(0,0,0,0.4);
    }

    .stat-box:hover{
      transform:translateY(-4px);
      background:#2563eb;
    }

    .stat-number{
      font-size:22px;
      font-weight:bold;
      margin-top:8px;
    }

    .lead-card{
      background: rgba(255,255,255,0.05);
      padding:18px;
      border-radius:15px;
      margin-bottom:15px;
      box-shadow:0 4px 20px rgba(0,0,0,0.4);
      transition:0.3s;
    }

    .lead-card:hover{
      transform:scale(1.01);
    }

    .blink{
      border:2px solid #ef4444;
      animation: blink 1s infinite;
    }

    @keyframes blink{
      0%{opacity:1;}
      50%{opacity:0.6;}
      100%{opacity:1;}
    }

    .phone{
      color:#22c55e;
      cursor:pointer;
      font-weight:bold;
    }

    .buttons button{
      margin-top:8px;
      margin-right:6px;
      padding:6px 10px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-size:12px;
      color:white;
    }

    .btn-int{ background:#22c55e; }
    .btn-call{ background:#facc15; color:black; }
    .btn-sw{ background:#ef4444; }
    .btn-join{ background:#3b82f6; }

    .toast{
      position:fixed;
      bottom:20px;
      left:50%;
      transform:translateX(-50%);
      background:#22c55e;
      padding:10px 20px;
      border-radius:20px;
      display:none;
      font-size:14px;
    }

  </style>
</head>

<body>

<header>
  <div>
    <div class="title">HIS Academy - Agent Dashboard</div>
    <div class="welcome" id="welcomeText"></div>
  </div>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">

  <!-- STAT BOXES -->
  <div class="stats">
    <div class="stat-box" onclick="setFilter('All')">
      Total Leads
      <div class="stat-number" id="totalCount">0</div>
    </div>

    <div class="stat-box" onclick="setFilter('Interested')">
      Interested
      <div class="stat-number" id="intCount">0</div>
    </div>

    <div class="stat-box" onclick="setFilter('Call Back')">
      Call Back
      <div class="stat-number" id="callCount">0</div>
    </div>

    <div class="stat-box" onclick="setFilter('Joined')">
      Joined
      <div class="stat-number" id="joinCount">0</div>
    </div>

    <div class="stat-box" onclick="setFilter('Switched Off')">
      Switched Off
      <div class="stat-number" id="swCount">0</div>
    </div>
  </div>

  <!-- LEADS -->
  <div id="leadContainer"></div>

</div>

<div class="toast" id="toast">Number Copied</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyB7xfwR2gBijRnVaasu_DZKuY8gLifimH0",
  authDomain: "dashboard-bd51c.firebaseapp.com",
  projectId: "dashboard-bd51c",
  storageBucket: "dashboard-bd51c.firebasestorage.app",
  messagingSenderId: "689809644516",
  appId: "1:689809644516:web:75d6051b300983afb545f1"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUID="";
let currentFilter="All";

auth.onAuthStateChanged(user=>{
  if(!user){
    window.location.href="index.html";
  }else{
    currentUID=user.uid;
    document.getElementById("welcomeText").innerText =
      "Welcome, "+user.displayName+" 👋";
    loadLeads();
  }
});

function loadLeads(){
  db.collection("leads")
  .where("assignedTo","==",currentUID)
  .onSnapshot(snapshot=>{

    let total=0,int=0,call=0,join=0,sw=0;
    let html="";

    snapshot.forEach(doc=>{
      const data=doc.data();
      total++;

      if(data.status==="Interested") int++;
      if(data.status==="Call Back") call++;
      if(data.status==="Joined") join++;
      if(data.status==="Switched Off") sw++;

      if(currentFilter==="All" || data.status===currentFilter){

        let blink="";
        if(data.callbackTime){
          const now=Date.now();
          const diff=data.callbackTime-now;
          if(diff<=1800000 && diff>0){
            blink="blink";
          }
        }

        html+=`
        <div class="lead-card ${blink}">
          <b>${data.studentName}</b><br>
          <span class="phone" onclick="copyNumber('${data.phone}')">
            ${data.phone}
          </span><br>
          Course: ${data.course || ''}<br>
          Status: ${data.status || 'New'}<br>
          ${data.amount ? 'Amount Collected: ₹'+data.amount : ''}

          <div class="buttons">
            <button class="btn-int" onclick="updateStatus('${doc.id}','Interested')">Interested</button>
            <button class="btn-call" onclick="setCallback('${doc.id}')">Call Back</button>
            <button class="btn-sw" onclick="updateStatus('${doc.id}','Switched Off')">Switched Off</button>
            <button class="btn-join" onclick="markJoined('${doc.id}')">Joined</button>
          </div>
        </div>
        `;
      }

    });

    document.getElementById("leadContainer").innerHTML=html;
    document.getElementById("totalCount").innerText=total;
    document.getElementById("intCount").innerText=int;
    document.getElementById("callCount").innerText=call;
    document.getElementById("joinCount").innerText=join;
    document.getElementById("swCount").innerText=sw;

  });
}

function setFilter(status){
  currentFilter=status;
  loadLeads();
}

function updateStatus(id,status){
  db.collection("leads").doc(id).update({
    status:status,
    updatedAt:new Date()
  });
}

function setCallback(id){
  let mins=prompt("Call back after how many minutes?");
  if(!mins) return;

  db.collection("leads").doc(id).update({
    status:"Call Back",
    callbackTime: Date.now() + (mins*60000),
    updatedAt:new Date()
  });
}

function markJoined(id){
  let amount=prompt("Enter Amount Collected:");
  if(!amount) return;

  db.collection("leads").doc(id).update({
    status:"Joined",
    amount:parseInt(amount),
    updatedAt:new Date()
  });
}

function copyNumber(number){
  navigator.clipboard.writeText(number);
  const toast=document.getElementById("toast");
  toast.style.display="block";
  setTimeout(()=>{ toast.style.display="none"; },1500);
}

function logout(){
  auth.signOut().then(()=>{
    window.location.href="index.html";
  });
}

</script>

</body>
</html>
