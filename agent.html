<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HIS Academy - Agent WAR Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f4f6f9;
}

.header{
    background:#1e3c72;
    color:white;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.main{
    padding:20px;
}

.date-container{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.date-card{
    background:white;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.summary-cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.summary-card{
    background:white;
    padding:15px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

.row-red{ background:#ffdddd; }
.row-orange{ background:#ffe5cc; }
.row-purple{ background:#f3e6ff; }
.row-grey{ background:#eeeeee; }

.warning{
    background:#ffcccc !important;
}

.overdue{
    animation:blink 1s infinite;
}

@keyframes blink{
    0%{background:#ff0000;}
    50%{background:#ffffff;}
    100%{background:#ff0000;}
}
</style>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>

<body>

<div class="header">
    <h2>HIS Academy - Agent WAR Panel</h2>
    <div>
        <span id="agentName"></span>
        <button onclick="logout()">Logout</button>
    </div>
</div>

<div class="main">

<h3>Select Date</h3>
<div id="dateContainer" class="date-container"></div>

<h3>Today's Performance</h3>
<div class="summary-cards" id="todaySummary"></div>

<h3 id="selectedDateTitle">Leads</h3>

<table>
<thead>
<tr>
<th>Name</th>
<th>Number</th>
<th>Status</th>
<th>Remark</th>
</tr>
</thead>
<tbody id="leadTable"></tbody>
</table>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB7xfwR2gBijRnVaasu_DZKuY8gLifimH0",
  authDomain: "dashboard-bd51c.firebaseapp.com",
  projectId: "dashboard-bd51c",
  storageBucket: "dashboard-bd51c.firebasestorage.app",
  messagingSenderId: "689809644516",
  appId: "1:689809644516:web:75d6051b300983afb545f1"
};
firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let agentUID=null;
let currentSelectedDate=null;

auth.onAuthStateChanged(user=>{
    if(!user){
        window.location.href="index.html";
        return;
    }

    agentUID=user.uid;

    db.collection("users").doc(agentUID).get().then(doc=>{
        document.getElementById("agentName").innerText=doc.data().name;
    });

    loadAvailableDates();
    loadTodaySummary();
});

function logout(){
    auth.signOut();
}

function loadAvailableDates(){

db.collection("leads")
.where("assignedTo","==",agentUID)
.where("deleted","==",false)
.onSnapshot(snapshot=>{

    const uniqueDates=new Set();

    snapshot.forEach(doc=>{
        const data=doc.data();
        if(data.createdAt){
            const d=data.createdAt.toDate();
            uniqueDates.add(d.toDateString());
        }
    });

    const container=document.getElementById("dateContainer");
    container.innerHTML="";

    uniqueDates.forEach(date=>{
        container.innerHTML+=`
            <div class="date-card" onclick="loadLeadsByDate('${date}')">
                ${date}
            </div>
        `;
    });

});
}

function loadLeadsByDate(date){

currentSelectedDate=date;
document.getElementById("selectedDateTitle").innerText="Leads - "+date;

const start=new Date(date);
start.setHours(0,0,0,0);

const end=new Date(date);
end.setHours(23,59,59,999);

db.collection("leads")
.where("assignedTo","==",agentUID)
.where("createdAt",">=",start)
.where("createdAt","<=",end)
.where("deleted","==",false)
.onSnapshot(snapshot=>{
    renderLeads(snapshot);
});
}

function renderLeads(snapshot){

const table=document.getElementById("leadTable");
table.innerHTML="";

const now=Date.now();

snapshot.forEach(doc=>{
    const data=doc.data();
    let rowClass="";

    if(data.status==="Wrong/Invalid") rowClass="row-red";
    if(data.status==="Not Interested") rowClass="row-orange";
    if(data.status==="Joined") rowClass="row-purple";
    if(data.status==="Switch Off") rowClass="row-grey";

    if(data.followUpTime){

        const remaining=data.followUpTime-now;

        if(remaining<1800000 && remaining>0){
            rowClass+=" warning";
        }

        if(now>data.followUpTime){

            rowClass+=" overdue";

            if(!data.escalated){
                db.collection("leads").doc(doc.id).update({escalated:true});
                db.collection("escalations").add({
                    leadId:doc.id,
                    agentId:agentUID,
                    escalatedAt:firebase.firestore.FieldValue.serverTimestamp()
                });
            }
        }
    }

    table.innerHTML+=`
        <tr class="${rowClass}">
        <td>${data.studentName}</td>
        <td onclick="copyNumber('${data.phone}')" style="cursor:pointer;color:blue;">
            ${data.phone}
        </td>
        <td>
            <select onchange="changeStatus('${doc.id}',this.value)">
                ${generateOptions(data.status)}
            </select>
        </td>
        <td>
            <input value="${data.remarks||""}" 
            onchange="saveRemark('${doc.id}',this.value)">
        </td>
        </tr>
    `;
});
}

function generateOptions(current){

const statuses=[
"New",
"Interested",
"Follow Up",
"Not Interested",
"Switch Off",
"Wrong/Invalid",
"Joined"
];

return statuses.map(s=>
`<option ${s===current?"selected":""}>${s}</option>`
).join("");
}

function changeStatus(id,status){

let updateData={
status:status,
updatedAt:firebase.firestore.FieldValue.serverTimestamp()
};

if(status==="Interested"||status==="Follow Up"){
    const date=prompt("Enter followup date (YYYY-MM-DD)");
    const time=prompt("Enter followup time (HH:MM)");

    if(!date||!time){
        alert("Followup required");
        return;
    }

    updateData.followUpTime=new Date(date+" "+time).getTime();
}

if(status==="Switch Off"){
    updateData.followUpTime=Date.now()+(12*60*60*1000);
}

db.collection("leads").doc(id).update(updateData);
}

function saveRemark(id,value){
db.collection("leads").doc(id).update({
remarks:value,
updatedAt:firebase.firestore.FieldValue.serverTimestamp()
});
}

function copyNumber(number){
navigator.clipboard.writeText(number);
}

function loadTodaySummary(){

const start=new Date();
start.setHours(0,0,0,0);

const end=new Date();
end.setHours(23,59,59,999);

db.collection("leads")
.where("assignedTo","==",agentUID)
.where("createdAt",">=",start)
.where("createdAt","<=",end)
.where("deleted","==",false)
.onSnapshot(snapshot=>{

let assigned=0,interested=0,notInt=0,switchOff=0,wrong=0,joined=0;

snapshot.forEach(doc=>{
const d=doc.data();
assigned++;

if(d.status==="Interested"||d.status==="Follow Up") interested++;
if(d.status==="Not Interested") notInt++;
if(d.status==="Switch Off") switchOff++;
if(d.status==="Wrong/Invalid") wrong++;
if(d.status==="Joined") joined++;
});

const pending=assigned-(interested+notInt+switchOff+wrong+joined);

document.getElementById("todaySummary").innerHTML=`
<div class="summary-card">Assigned<br><b>${assigned}</b></div>
<div class="summary-card">Pending<br><b>${pending}</b></div>
<div class="summary-card">Interested/FollowUp<br><b>${interested}</b></div>
<div class="summary-card">Not Interested<br><b>${notInt}</b></div>
<div class="summary-card">Switch Off<br><b>${switchOff}</b></div>
<div class="summary-card">Wrong/Invalid<br><b>${wrong}</b></div>
<div class="summary-card">Joined<br><b>${joined}</b></div>
`;
});
}

</script>
</body>
</html>
