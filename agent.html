<!DOCTYPE html>
<html>
<head>
  <title>HIS Academy - Agent Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    body{
      margin:0;
      font-family:Segoe UI, sans-serif;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
    }

    header{
      padding:20px;
      background:rgba(30,41,59,0.9);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .container{
      padding:20px;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
      gap:15px;
      margin-bottom:25px;
    }

    .box{
      background:rgba(255,255,255,0.05);
      padding:18px;
      border-radius:12px;
      text-align:center;
      cursor:pointer;
      transition:0.3s;
    }

    .box:hover{
      background:#2563eb;
    }

    .box span{
      display:block;
      font-size:22px;
      font-weight:bold;
    }

    .lead{
      background:rgba(255,255,255,0.05);
      padding:15px;
      border-radius:12px;
      margin-bottom:15px;
    }

    .blink{
      border:2px solid red;
      animation:blink 1s infinite;
    }

    @keyframes blink{
      0%{opacity:1;}
      50%{opacity:0.6;}
      100%{opacity:1;}
    }

    button{
      padding:6px 10px;
      border:none;
      border-radius:6px;
      margin:5px 5px 0 0;
      cursor:pointer;
    }

    .green{background:#22c55e;}
    .yellow{background:#facc15;color:black;}
    .red{background:#ef4444;}
    .blue{background:#3b82f6;}

    .phone{
      color:#22c55e;
      cursor:pointer;
      font-weight:bold;
    }

    .toast{
      position:fixed;
      bottom:20px;
      left:50%;
      transform:translateX(-50%);
      background:#22c55e;
      padding:8px 15px;
      border-radius:20px;
      display:none;
    }

  </style>
</head>

<body>

<header>
  <div>
    <h3>HIS Academy - Agent Dashboard</h3>
    <div id="welcome"></div>
  </div>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">

  <div class="stats">
    <div class="box" onclick="setFilter('All')">
      <span id="total">0</span>Total
    </div>
    <div class="box" onclick="setFilter('Interested')">
      <span id="interested">0</span>Interested
    </div>
    <div class="box" onclick="setFilter('Call Back')">
      <span id="callback">0</span>Call Back
    </div>
    <div class="box" onclick="setFilter('Joined')">
      <span id="joined">0</span>Joined
    </div>
    <div class="box" onclick="setFilter('Switched Off')">
      <span id="switched">0</span>Switched Off
    </div>
  </div>

  <div id="leadList"></div>

</div>

<div class="toast" id="toast">Number Copied</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyB7xfwR2gBijRnVaasu_DZKuY8gLifimH0",
  authDomain: "dashboard-bd51c.firebaseapp.com",
  projectId: "dashboard-bd51c",
  storageBucket: "dashboard-bd51c.firebasestorage.app",
  messagingSenderId: "689809644516",
  appId: "1:689809644516:web:75d6051b300983afb545f1"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUID="";
let currentFilter="All";

auth.onAuthStateChanged(function(user){
  if(!user){
    window.location.href="index.html";
  } else {
    currentUID=user.uid;
    document.getElementById("welcome").innerText="Welcome, "+(user.displayName || "");
    loadLeads();
  }
});

function loadLeads(){
  db.collection("leads")
  .where("assignedTo","==",currentUID)
  .onSnapshot(function(snapshot){

    let total=0, interested=0, callback=0, joined=0, switched=0;
    let html="";

    snapshot.forEach(function(doc){

      const data=doc.data();
      total++;

      if(data.status==="Interested") interested++;
      if(data.status==="Call Back") callback++;
      if(data.status==="Joined") joined++;
      if(data.status==="Switched Off") switched++;

      if(currentFilter==="All" || data.status===currentFilter){

        let blinkClass="";
        if(data.callbackTime){
          let now=new Date().getTime();
          if(data.callbackTime-now <= 1800000 && data.callbackTime-now > 0){
            blinkClass="blink";
          }
        }

        html+=`
          <div class="lead ${blinkClass}">
            <b>${data.studentName}</b><br>
            <span class="phone" onclick="copyPhone('${data.phone}')">
              ${data.phone}
            </span><br>
            Course: ${data.course || ""}<br>
            Status: ${data.status || "New"}<br>
            ${data.amount ? "Amount: ₹"+data.amount+"<br>" : ""}

            <button class="green" onclick="updateStatus('${doc.id}','Interested')">Interested</button>
            <button class="yellow" onclick="setCallback('${doc.id}')">Call Back</button>
            <button class="red" onclick="updateStatus('${doc.id}','Switched Off')">Switched Off</button>
            <button class="blue" onclick="markJoined('${doc.id}')">Joined</button>
          </div>
        `;
      }

    });

    document.getElementById("leadList").innerHTML=html;
    document.getElementById("total").innerText=total;
    document.getElementById("interested").innerText=interested;
    document.getElementById("callback").innerText=callback;
    document.getElementById("joined").innerText=joined;
    document.getElementById("switched").innerText=switched;

  });
}

function setFilter(status){
  currentFilter=status;
  loadLeads();
}

function updateStatus(id,status){
  db.collection("leads").doc(id).update({
    status:status,
    updatedAt:new Date()
  });
}

function setCallback(id){
  let minutes=prompt("Call back after how many minutes?");
  if(!minutes) return;

  let time=new Date().getTime()+minutes*60000;

  db.collection("leads").doc(id).update({
    status:"Call Back",
    callbackTime:time,
    updatedAt:new Date()
  });
}

function markJoined(id){
  let amount=prompt("Enter Amount Collected:");
  if(!amount) return;

  db.collection("leads").doc(id).update({
    status:"Joined",
    amount:parseInt(amount),
    updatedAt:new Date()
  });
}

function copyPhone(phone){
  navigator.clipboard.writeText(phone);
  let toast=document.getElementById("toast");
  toast.style.display="block";
  setTimeout(()=>{toast.style.display="none";},1500);
}

function logout(){
  auth.signOut().then(function(){
    window.location.href="index.html";
  });
}

</script>

</body>
</html>
