<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HIS Academy - Agent Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f6f9;
}

/* HEADER */
.header{
    background:linear-gradient(90deg,#1e3c72,#2a5298);
    color:white;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h2{
    margin:0;
}

.header button{
    background:white;
    border:none;
    padding:8px 15px;
    border-radius:6px;
    cursor:pointer;
}

/* CONTAINER */
.container{
    padding:30px;
}

/* WELCOME */
.welcome{
    font-size:22px;
    margin-bottom:25px;
    color:#333;
}

/* STAT CARDS */
.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.stat-card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.05);
    text-align:center;
}

.stat-card h4{
    margin:0;
    font-weight:normal;
    color:#555;
}

.stat-card h2{
    margin:10px 0 0 0;
}

/* Colored numbers */
.blue{ color:#2a5298; }
.green{ color:#2ecc71; }
.red{ color:#e74c3c; }
.orange{ color:#f39c12; }
.gray{ color:#7f8c8d; }

/* FILTER ROW */
.filter-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

.filter-row input{
    padding:8px;
    width:250px;
    border-radius:6px;
    border:1px solid #ccc;
}

.filter-row select{
    padding:8px;
    border-radius:6px;
    border:1px solid #ccc;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

th,td{
    padding:12px;
    text-align:left;
}

th{
    background:#f1f3f6;
}

tr:nth-child(even){
    background:#fafafa;
}

/* STATUS BADGES */
.badge{
    padding:6px 12px;
    border-radius:20px;
    color:white;
    font-size:13px;
}

.badge-new{ background:#3498db; }
.badge-interested{ background:#2ecc71; }
.badge-not{ background:#e74c3c; }
.badge-call{ background:#f39c12; }
.badge-switch{ background:#7f8c8d; }
.badge-joined{ background:#8e44ad; }

/* REMARK INPUT */
.remark-input{
    width:100%;
    padding:5px;
    border-radius:5px;
    border:1px solid #ccc;
}

</style>
    <!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

</head>

<body>

<div class="header">
    <h2>HIS Academy - Agent Portal</h2>
    <div>
        Welcome, <b id="agentName">Agent</b>
        <button>Logout</button>
    </div>
</div>

<div class="container">

    <div class="welcome">
        Welcome to HIS Academy CRM
    </div>

    <!-- STATS -->
    <div class="stats">
        <div class="stat-card">
            <h4>Total Leads</h4>
            <h2 class="blue" id="totalLeads">0</h2>
        </div>
        <div class="stat-card">
            <h4>Interested</h4>
            <h2 class="green" id="totalInterested">0</h2>
        </div>
        <div class="stat-card">
            <h4>Not Interested</h4>
            <h2 class="red" id="totalNotInterested">0</h2>
        </div>
        <div class="stat-card">
            <h4>Call Back</h4>
            <h2 class="orange" id="totalCall">0</h2>
        </div>
        <div class="stat-card">
            <h4>Switch Off</h4>
            <h2 class="gray" id="totalSwitch">0</h2>
        </div>
    </div>

    <!-- FILTER -->
    <div class="filter-row">
        <select>
            <option>All</option>
            <option>Interested</option>
            <option>Not Interested</option>
            <option>Call Back</option>
            <option>Switch Off</option>
            <option>Joined</option>
        </select>

        <input type="text" placeholder="Search leads...">
    </div>

    <!-- TABLE -->
    <table>
        <thead>
            <tr>
                <th>Lead Name</th>
                <th>Phone</th>
                <th>Status</th>
                <th>Follow Up</th>
                <th>Amount</th>
                <th>Remark</th>
            </tr>
        </thead>
        <tbody id="leadTable">

            <!-- SAMPLE ROW -->
            <tr>
                <td>Rajesh Kumar</td>
                <td>9876543210</td>
                <td><span class="badge badge-interested">Interested</span></td>
                <td>-</td>
                <td>0</td>
                <td><input class="remark-input" placeholder="Write remark..."></td>
            </tr>

        </tbody>
    </table>

</div>
<script>

const firebaseConfig = {
  apiKey: "AIzaSyB7xfwR2gBijRnVaasu_DZKuY8gLifimH0",
  authDomain: "dashboard-bd51c.firebaseapp.com",
  projectId: "dashboard-bd51c",
  storageBucket: "dashboard-bd51c.firebasestorage.app",
  messagingSenderId: "689809644516",
  appId: "1:689809644516:web:75d6051b300983afb545f1"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let agentUID = null;

auth.onAuthStateChanged(user=>{
    if(!user){
        window.location.href="index.html";
        return;
    }

    agentUID = user.uid;

    db.collection("users").doc(agentUID).get().then(doc=>{
        document.getElementById("agentName").innerText = doc.data().name;
    });

    loadAgentLeads();
});
function loadAgentLeads(){

    db.collection("leads")
    .where("assignedTo","==",agentUID)
    .where("deleted","==",false)
    .onSnapshot(snapshot=>{

        const table = document.getElementById("leadTable");
        table.innerHTML="";

        let total=0, interested=0, notInterested=0, call=0, switchOff=0;

        snapshot.forEach(doc=>{

            const data = doc.data();
            total++;

            if(data.status==="Interested") interested++;
            if(data.status==="Not Interested") notInterested++;
            if(data.status==="Follow Up") call++;
            if(data.status==="Switch Off") switchOff++;

            table.innerHTML += `
                <tr>
                    <td>${data.studentName}</td>
                    <td onclick="copyNumber('${data.phone}')" style="cursor:pointer;color:#2a5298;">
                        ${data.phone}
                    </td>
                    <td>
  <select onchange="changeStatus('${doc.id}', this.value)" class="status-select">
    ${generateStatusOptions(data.status)}
  </select>
</td>

                    <td>${data.followUpTime ? new Date(data.followUpTime).toLocaleString() : "-"}</td>
                    <td>${data.amount || 0}</td>
                    <td>
                        <input class="remark-input"
                        value="${data.remarks || ''}"
                        onchange="saveRemark('${doc.id}',this.value)">
                    </td>
                </tr>
            `;
        });

        document.getElementById("totalLeads").innerText=total;
        document.getElementById("totalInterested").innerText=interested;
        document.getElementById("totalNotInterested").innerText=notInterested;
        document.getElementById("totalCall").innerText=call;
        document.getElementById("totalSwitch").innerText=switchOff;

    });

}
function getBadgeClass(status){
    if(status==="Interested") return "interested";
    if(status==="Not Interested") return "not";
    if(status==="Follow Up") return "call";
    if(status==="Switch Off") return "switch";
    if(status==="Joined") return "joined";
    return "new";
}
function copyNumber(number){
    navigator.clipboard.writeText(number);
    alert("Number Copied");
}
function saveRemark(id,value){

    db.collection("leads").doc(id).update({
        remarks:value,
        updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    });

}
    function generateStatusOptions(current){

    const statuses = [
        "New",
        "Interested",
        "Not Interested",
        "Follow Up",
        "Switch Off",
        "Joined"
    ];

    return statuses.map(status => 
        `<option value="${status}" ${status===current ? "selected" : ""}>${status}</option>`
    ).join("");

}

function changeStatus(id,newStatus){

    const updateData = {
        status:newStatus,
        updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    };

    // Clear followUpTime by default
    updateData.followUpTime = null;

    if(newStatus === "Follow Up"){

        const time = prompt("Enter follow-up time (YYYY-MM-DD HH:MM)");

        if(!time){
            alert("Follow-up cancelled");
            return;
        }

        updateData.followUpTime = new Date(time).getTime();
    }

    if(newStatus === "Switch Off"){
        const now = new Date().getTime();
        updateData.followUpTime = now + (8 * 60 * 60 * 1000);
    }

    if(newStatus === "Joined"){
        const amount = prompt("Enter collected amount");

        if(!amount){
            alert("Amount required");
            return;
        }

        updateData.amount = parseInt(amount);
    }

    db.collection("leads").doc(id).update(updateData);

}

</script>
<!-- Follow Up Modal -->
<div id="followUpModal" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
justify-content:center;
align-items:center;
z-index:999;
">

  <div style="
    background:white;
    padding:25px;
    border-radius:10px;
    width:300px;
  ">

    <h3>Select Follow Up Time</h3>

    <input type="date" id="followDate" style="width:100%;margin-bottom:10px;padding:8px;">
    <input type="time" id="followTime" style="width:100%;margin-bottom:15px;padding:8px;">

    <button onclick="saveFollowUp()" style="background:#2a5298;color:white;padding:8px 15px;border:none;border-radius:5px;">Save</button>
    <button onclick="closeFollowUp()" style="margin-left:10px;padding:8px 15px;">Cancel</button>

  </div>

</div>

</body>
</html>
