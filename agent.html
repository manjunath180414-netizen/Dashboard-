<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIS Academy CRM</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#050c1f,#0b1b3a);
color:white;
}

/* HEADER */
.header{
padding:20px;
}

.title{
font-size:20px;
color:#7dd3fc;
font-weight:600;
}

.welcome{
margin-top:5px;
color:#cbd5e1;
}

/* STAT BOXES */
.box-row{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
padding:0 20px;
margin-top:10px;
}

.box-row-4{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
padding:0 20px;
margin-top:10px;
}

.box{
background:rgba(30,64,175,0.25);
border:1px solid #3b82f6;
border-radius:14px;
padding:15px;
text-align:center;
box-shadow:0 0 20px rgba(59,130,246,0.6),
           0 0 40px rgba(59,130,246,0.3);
}

.box h2{
margin:0;
font-size:22px;
}

.box p{
margin:5px 0 0;
font-size:13px;
}

/* TABLE CARD */
.table-container{
width:92%;
margin:30px auto;
background:rgba(15,30,70,0.85);
border-radius:18px;
padding:20px;
box-shadow:0 0 30px #0ea5e9;
}

/* TABLE */
table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:14px;
text-align:left;
}

th{
color:#93c5fd;
font-weight:500;
}

tr{
border-bottom:1px solid rgba(255,255,255,0.08);
transition:0.3s;
}

/* STATUS STRIP */
.status-strip{
width:6px;
}

.interested{border-left:6px solid #22c55e;}
.notinterested{border-left:6px solid #ef4444;}
.switch{border-left:6px solid #f59e0b;}
.joined{border-left:6px solid #06b6d4;}
.wrong{border-left:6px solid #dc2626;}

/* TIMER */
.timer{
font-weight:600;
}

.missed{
color:#ff0000;
animation:blink 1s infinite;
}

@keyframes blink{
50%{opacity:0.4;}
}

select,input{
background:#0f172a;
color:white;
padding:6px;
border-radius:8px;
border:1px solid #38bdf8;
}

.phone{
color:#22c55e;
font-weight:600;
}
</style>
</head>
<body>

<div class="header">
<div class="title">HIS Academy – Let us change the way students study</div>
<div class="welcome">Loading...</div>
</div>

<!-- 3 BOXES -->
<div class="box-row">
<div class="box"><h2 id="assignedCount">0</h2><p>Assigned Today</p></div>
<div class="box"><h2 id="calledCount">0</h2><p>Called Today</p></div>
<div class="box"><h2 id="pendingCount">0</h2><p>Pending Today</p></div>
</div>

<!-- 4 BOXES -->
<div class="box-row-4">
<div class="box"><h2 id="interestedCount">0</h2><p>Interested</p></div>
<div class="box"><h2 id="notInterestedCount">0</h2><p>Not Interested</p></div>
<div class="box"><h2 id="followUpCount">0</h2><p>Follow Up</p></div>
<div class="box"><h2 id="joinedCount">0</h2><p>Joined</p></div>
</div>

<div class="table-container">
<h3>Today's Leads</h3>

<table>
<thead>
<tr>
<th></th>
<th>Name</th>
<th>Phone</th>
<th>Status</th>
<th>Follow Up / Amount</th>
</tr>
</thead>

<tbody id="leadTable"></tbody>
</table>
</div>

           <script>
<script>

const firebaseConfig = {
apiKey: "AIzaSyB7xfwR2gBijRnVaasu_DZKuY8gLifimH0",
authDomain: "dashboard-bd51c.firebaseapp.com",
projectId: "dashboard-bd51c",
storageBucket: "dashboard-bd51c.firebasestorage.app",
messagingSenderId: "689809644516",
appId: "1:689809644516:web:75d6051b300983afb545f1"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUID="";
let allLeads=[];
let currentFilter="All";
let missedLeads=[];

auth.onAuthStateChanged(user=>{
if(!user){
window.location.href="index.html";
}else{
currentUID=user.uid;
loadLeads();
}
});

function loadLeads(){
db.collection("leads")
.where("assignedTo","==",currentUID)
.onSnapshot(snapshot=>{

allLeads=[];
snapshot.forEach(doc=>{
allLeads.push({...doc.data(), id:doc.id});
});

checkMissedLeads();
renderLeads();
updateCounts();

});
}

/* MISSED FOLLOW UP CHECK */
function checkMissedLeads(){

missedLeads=[];
let now=Date.now();

allLeads.forEach(l=>{
if(l.followUpTime && l.followUpTime <= now && l.status==="Follow Up"){
missedLeads.push(l);
}
});

createMissedBanner();
}

function createMissedBanner(){

let existing=document.getElementById("missedBanner");
if(existing) existing.remove();

if(missedLeads.length>0){

let banner=document.createElement("div");
banner.id="missedBanner";
banner.innerHTML=`⚠ ${missedLeads.length} Leads Missed Follow Up - CLICK TO VIEW`;
banner.style.background="#b91c1c";
banner.style.color="white";
banner.style.padding="10px";
banner.style.textAlign="center";
banner.style.fontWeight="600";
banner.style.animation="blinkBanner 0.5s infinite";

banner.onclick=()=>{
currentFilter="Missed";
renderLeads();
};

document.body.insertBefore(banner, document.body.firstChild);

let style=document.createElement("style");
style.innerHTML=`
@keyframes blinkBanner{
50%{opacity:0.3;}
}
`;
document.head.appendChild(style);
}
}

/* RENDER */
function renderLeads(){

leadTable.innerHTML="";

let displayLeads=allLeads;

if(currentFilter==="Missed"){
displayLeads=missedLeads;
}

displayLeads.forEach(createRow);

}

/* UPDATE COUNTS */
function updateCounts(){

let assigned=allLeads.length;
let called=0,pending=0,interested=0,notInterested=0,followUp=0,joined=0;

allLeads.forEach(l=>{
if(l.status!=="New") called++;
if(l.status==="New") pending++;
if(l.status==="Interested") interested++;
if(l.status==="Not Interested") notInterested++;
if(l.status==="Follow Up") followUp++;
if(l.status==="Joined") joined++;
});

assignedCount.innerText=assigned;
calledCount.innerText=called;
pendingCount.innerText=pending;
interestedCount.innerText=interested;
notInterestedCount.innerText=notInterested;
followUpCount.innerText=followUp;
joinedCount.innerText=joined;
}

/* TIMER */
function startTimer(cell,lead){

let interval=setInterval(()=>{

let remaining=Math.floor((lead.followUpTime-Date.now())/1000);

if(remaining>0){
cell.innerHTML="Call in "+remaining+" sec";
}else{
cell.innerHTML="Missed Follow Up";
cell.style.color="red";
clearInterval(interval);
checkMissedLeads();
}
},1000);
}

/* CREATE ROW */
function createRow(lead){

let row=document.createElement("tr");

row.innerHTML=`
<td></td>
<td>${lead.studentName}</td>
<td class="phone">${lead.phone}</td>
<td>
<select>
<option ${lead.status==="New"?"selected":""}>New</option>
<option ${lead.status==="Interested"?"selected":""}>Interested</option>
<option ${lead.status==="Not Interested"?"selected":""}>Not Interested</option>
<option ${lead.status==="Follow Up"?"selected":""}>Follow Up</option>
<option ${lead.status==="Switch Off"?"selected":""}>Switch Off</option>
<option ${lead.status==="Wrong Number"?"selected":""}>Wrong Number</option>
<option ${lead.status==="Joined"?"selected":""}>Joined</option>
</select>
</td>
<td class="dynamic">${lead.amount?("₹"+lead.amount):""}</td>
`;

let select=row.querySelector("select");
let dynamic=row.querySelector(".dynamic");

/* PHONE COPY */
row.querySelector(".phone").onclick=()=>{
navigator.clipboard.writeText(lead.phone);
alert("Number Copied");
};

/* RESTORE TIMER */
if(lead.status==="Follow Up" && lead.followUpTime){
startTimer(dynamic,lead);
}

/* STATUS CHANGE */
select.onchange=function(){

let newStatus=this.value;

/* RESET COLOR */
select.style.background="#0f172a";

/* INTERESTED */
if(newStatus==="Interested"){
select.style.background="#22c55e";
db.collection("leads").doc(lead.id).update({status:newStatus});
}

/* NOT INTERESTED */
if(newStatus==="Not Interested"){
select.style.background="#ef4444";
db.collection("leads").doc(lead.id).update({status:newStatus});
}

/* FOLLOW UP */
if(newStatus==="Follow Up"){

let timeInput=document.createElement("input");
timeInput.type="time";
dynamic.innerHTML="";
dynamic.appendChild(timeInput);

timeInput.onchange=function(){

if(!this.value){
alert("Follow up time required");
select.value="New";
return;
}

let now=new Date();
let parts=this.value.split(":");
let selected=new Date();

selected.setHours(parts[0]);
selected.setMinutes(parts[1]);
selected.setSeconds(0);

/* FIX FOR TOMORROW */
if(selected.getTime() <= now.getTime()){
selected.setDate(selected.getDate()+1);
}

let target=selected.getTime();

db.collection("leads").doc(lead.id).update({
status:newStatus,
followUpTime:target
});

startTimer(dynamic,lead);

};

return;
}

/* SWITCH OFF */
if(newStatus==="Switch Off"){
let target=Date.now()+8*60*60*1000;

db.collection("leads").doc(lead.id).update({
status:newStatus,
followUpTime:target
});
}

/* WRONG NUMBER */
if(newStatus==="Wrong Number"){
select.style.background="#7f1d1d";
db.collection("leads").doc(lead.id).update({status:newStatus});
}

/* JOINED */
if(newStatus==="Joined"){

let amount="";
while(!amount){
amount=prompt("Enter Amount Paid (Required)");
if(amount===null){
select.value="New";
return;
}
}

db.collection("leads").doc(lead.id).update({
status:newStatus,
amount:parseInt(amount)
});

dynamic.innerHTML="₹"+amount;
}

};

leadTable.appendChild(row);
}

</script>



</body>
</html>
