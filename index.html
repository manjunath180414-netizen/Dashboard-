<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HIS Academy CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.login-box{
    background:white;
    padding:40px;
    border-radius:10px;
    box-shadow:0 5px 20px rgba(0,0,0,0.3);
    text-align:center;
}
button{
    padding:12px 20px;
    border:none;
    border-radius:6px;
    background:#4285F4;
    color:white;
    font-size:16px;
    cursor:pointer;
}
button:hover{
    background:#3367d6;
}
.error{
    color:red;
    margin-top:10px;
}
</style>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>

<body>

<div class="login-box">
<h2>HIS Academy CRM</h2>
<button onclick="googleLogin()">Sign in with Google</button>
<p id="errorMsg" class="error"></p>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyB7xfwR2gBijRnVaasu_DZKuY8gLifimH0",
  authDomain: "dashboard-bd51c.firebaseapp.com",
  projectId: "dashboard-bd51c",
  storageBucket: "dashboard-bd51c.firebasestorage.app",
  messagingSenderId: "689809644516",
  appId: "1:689809644516:web:75d6051b300983afb545f1"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

function googleLogin(){

    const provider = new firebase.auth.GoogleAuthProvider();

    auth.signInWithPopup(provider)
    .then(result=>{

        const user = result.user;

        // Create user doc if not exists
        db.collection("users").doc(user.uid).set({
            name: user.displayName,
            email: user.email,
        }, { merge:true });

        if(user.email === "hisacademyofficial@gmail.com"){
            window.location.href="ad.html";
            return;
        }

        db.collection("users").doc(user.uid).get()
        .then(doc=>{

            if(!doc.exists){
                document.getElementById("errorMsg").innerText="Not Registered";
                return;
            }

            const role = doc.data().role;

            if(role === "cleaner") window.location.href="1.html";
            else if(role === "info") window.location.href="2.html";
            else if(role === "final") window.location.href="3.html";
            else if(role === "manager") window.location.href="ad.html";
            else{
                document.getElementById("errorMsg").innerText="Access Denied";
                auth.signOut();
            }
        });

    })
    .catch(error=>{
        document.getElementById("errorMsg").innerText=error.message;
    });
}

</script>

</body>
</html>
