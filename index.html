<!DOCTYPE html>
<html>
<head>
  <title>HIS CRM Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase v8 CDN -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    body {
      margin:0;
      font-family: Arial;
      background:#0f172a;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      color:white;
    }

    .box {
      background:#1e293b;
      padding:30px;
      border-radius:10px;
      width:320px;
      text-align:center;
      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    input {
      width:100%;
      padding:10px;
      margin:10px 0;
      border-radius:5px;
      border:none;
      outline:none;
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #2563eb;
      cursor: pointer;
      font-size: 12px;
    }

    button.login-btn {
      width:100%;
      padding:10px;
      background:#2563eb;
      color:white;
      border:none;
      border-radius:5px;
      cursor:pointer;
      font-weight:bold;
      margin-top:10px;
    }

    button:disabled {
      background:gray;
    }

    #error {
      color:#f87171;
      margin-top:10px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>HIS Academy CRM</h2>

  <input type="email" id="email" placeholder="Email">

  <div class="password-wrapper">
    <input type="password" id="password" placeholder="Password">
    <button type="button" class="toggle-btn" onclick="togglePassword()">Show</button>
  </div>

  <button onclick="login()" id="loginBtn" class="login-btn">Login</button>

  <p id="error"></p>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyB7xfwR2gBijRnVaasu_DZKuY8gLifimH0",
  authDomain: "dashboard-bd51c.firebaseapp.com",
  projectId: "dashboard-bd51c",
  storageBucket: "dashboard-bd51c.firebasestorage.app",
  messagingSenderId: "689809644516",
  appId: "1:689809644516:web:75d6051b300983afb545f1",
  measurementId: "G-5GWRNP2F9K"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function togglePassword() {
  const passwordInput = document.getElementById("password");
  const toggleBtn = document.querySelector(".toggle-btn");

  if (passwordInput.type === "password") {
    passwordInput.type = "text";
    toggleBtn.innerText = "Hide";
  } else {
    passwordInput.type = "password";
    toggleBtn.innerText = "Show";
  }
}

function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const error = document.getElementById("error");
  const loginBtn = document.getElementById("loginBtn");

  error.innerText = "";
  loginBtn.innerText = "Logging in...";
  loginBtn.disabled = true;

  auth.signInWithEmailAndPassword(email, password)
    .then(function(userCredential) {
      const user = userCredential.user;
      checkUserRole(user.uid);
    })
    .catch(function(err) {
      error.innerText = err.message;
    })
    .finally(function() {
      loginBtn.innerText = "Login";
      loginBtn.disabled = false;
    });
}

function checkUserRole(uid) {
  db.collection("users").doc(uid).get()
    .then(function(doc) {

      if (!doc.exists) {
        document.getElementById("error").innerText =
          "User role not assigned.";
        return;
      }

      const role = doc.data().role;

      if (role === "owner") {
        window.location.href = "owner.html";
      }
      else if (role === "manager") {
        window.location.href = "manager.html";
      }
      else if (role === "agent") {
        window.location.href = "agent.html";
      }
      else {
        document.getElementById("error").innerText =
          "Invalid role assigned.";
      }
    })
    .catch(function(error) {
      document.getElementById("error").innerText = error.message;
    });
}

</script>

</body>
</html>
