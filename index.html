<!DOCTYPE html>
<html>
<head>
  <title>HIS CRM Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase v8 CDN -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    body {
      margin:0;
      font-family: Arial;
      background:#0f172a;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      color:white;
    }

    .box {
      background:#1e293b;
      padding:30px;
      border-radius:10px;
      width:320px;
      text-align:center;
      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    button {
      width:100%;
      padding:12px;
      background:white;
      color:black;
      border:none;
      border-radius:5px;
      cursor:pointer;
      font-weight:bold;
      margin-top:20px;
    }

    #error {
      color:#f87171;
      margin-top:15px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>HIS Academy CRM</h2>

  <button onclick="googleLogin()">Login with Google</button>

  <p id="error"></p>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyB7xfwR2gBijRnVaasu_DZKuY8gLifimH0",
  authDomain: "dashboard-bd51c.firebaseapp.com",
  projectId: "dashboard-bd51c",
  storageBucket: "dashboard-bd51c.firebasestorage.app",
  messagingSenderId: "689809644516",
  appId: "1:689809644516:web:75d6051b300983afb545f1",
  measurementId: "G-5GWRNP2F9K"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const provider = new firebase.auth.GoogleAuthProvider();

function googleLogin() {

  auth.signInWithPopup(provider)
  .then(result => {
      const user = result.user;
      checkUserRole(user.uid);
  })
  .catch(error => {
      document.getElementById("error").innerText = error.message;
  });
}

function checkUserRole(uid) {

  db.collection("users").doc(uid).get()
  .then(doc => {

      if (!doc.exists) {
          document.getElementById("error").innerText =
            "Access not granted. Contact Owner.";
          return;
      }

      const role = doc.data().role;

      if (role === "owner") {
          window.location.href = "owner.html";
      }
      else if (role === "manager") {
          window.location.href = "manager.html";
      }
      else if (role === "agent") {
          window.location.href = "agent.html";
      }
      else {
          document.getElementById("error").innerText =
            "Invalid role assigned.";
      }

  })
  .catch(error => {
      document.getElementById("error").innerText = error.message;
  });
}

</script>

</body>
</html>
