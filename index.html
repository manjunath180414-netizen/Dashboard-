<!DOCTYPE html>
<html>
<head>
  <title>HIS CRM Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase v8 CDN -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0f172a;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      color:white;
    }

    .box{
      background:#1e293b;
      padding:30px;
      border-radius:10px;
      width:340px;
      text-align:center;
      box-shadow:0 0 25px rgba(0,0,0,0.4);
    }

    button{
      width:100%;
      padding:12px;
      margin-top:15px;
      border:none;
      border-radius:6px;
      cursor:pointer;
      font-weight:bold;
    }

    .google-btn{
      background:white;
      color:black;
    }

    .dashboard-btn{
      background:#22c55e;
      color:white;
    }

    #status{
      margin-top:15px;
      font-size:14px;
      color:#9ca3af;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>HIS Academy CRM</h2>

  <button class="google-btn" onclick="googleLogin()">
    Login with Google
  </button>

  <button class="dashboard-btn" id="goDashboard" style="display:none;" onclick="goDashboard()">
    Already Logged In – Go to Dashboard
  </button>

  <p id="status"></p>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyB7xfwR2gBijRnVaasu_DZKuY8gLifimH0",
  authDomain: "dashboard-bd51c.firebaseapp.com",
  projectId: "dashboard-bd51c",
  storageBucket: "dashboard-bd51c.firebasestorage.app",
  messagingSenderId: "689809644516",
  appId: "1:689809644516:web:75d6051b300983afb545f1"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const provider = new firebase.auth.GoogleAuthProvider();

// Google Login
function googleLogin(){
  auth.signInWithPopup(provider)
  .then(result=>{
      const user = result.user;

      saveUserToDatabase(user);
  })
  .catch(error=>{
      document.getElementById("status").innerText = error.message;
  });
}

// Save user in Firestore
function saveUserToDatabase(user){

  const userRef = db.collection("users").doc(user.uid);

  userRef.get()
  .then(doc=>{

      if(!doc.exists){
          return userRef.set({
              name: user.displayName || "",
              email: user.email,
              role: "agent", // default role
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
      }
  })
  .then(()=>{
      return userRef.get();
  })
  .then(doc=>{
      const role = doc.data().role;
      redirectBasedOnRole(role);
  })
  .catch(error=>{
      console.log("Firestore Error:", error);
      document.getElementById("status").innerText = error.message;
  });
}


// Redirect
function redirectBasedOnRole(role){

  if(role==="owner"){
      window.location.href="owner.html";
  }
  else if(role==="manager"){
      window.location.href="manager.html";
  }
  else{
      window.location.href="agent.html";
  }
}

// Auto Detect Logged In User
auth.onAuthStateChanged(user=>{
  if(user){
      document.getElementById("goDashboard").style.display="block";
      document.getElementById("status").innerText =
      "Logged in as: " + user.email;
  }
});

// Dashboard Button
function goDashboard(){
  const user = auth.currentUser;
  if(user){
      db.collection("users").doc(user.uid).get()
      .then(doc=>{
          const role = doc.data().role;
          redirectBasedOnRole(role);
      });
  }
}

</script>

</body>
</html>
