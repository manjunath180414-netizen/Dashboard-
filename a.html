<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HIS Academy - Agent Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f6f9;
}
.header{
    background:linear-gradient(90deg,#1e3c72,#2a5298);
    color:white;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.container{ padding:30px; }

.card{
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
    max-width:500px;
    margin:auto;
    text-align:center;
}

button{
    padding:10px 20px;
    margin:5px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.copy-btn{ background:#2a5298;color:white; }
.status-btn{ background:#28a745;color:white; }
</style>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>

<body>

<div class="header">
<h2>HIS Academy - Calling Mode</h2>
<div>
Welcome, <b id="agentName">Agent</b>
<button onclick="logout()">Logout</button>
</div>
</div>

<div class="container">
<div id="statsCards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-bottom:25px;">

<div class="card" onclick="filterLeads('ALL')">
<h4>Assigned</h4>
<h2 id="countAssigned">0</h2>
</div>

<div class="card" onclick="filterLeads('New')">
<h4>New</h4>
<h2 id="countNew">0</h2>
</div>

<div class="card" onclick="filterLeads('Interested/follow up')">
<h4>Interested</h4>
<h2 id="countInterested">0</h2>
</div>

<div class="card" onclick="filterLeads('Not Received')">
<h4>Not Received</h4>
<h2 id="countNotReceived">0</h2>
</div>

<div class="card" onclick="filterLeads('Switch Off')">
<h4>Switch Off</h4>
<h2 id="countSwitch">0</h2>
</div>

<div class="card" onclick="filterLeads('Not Interested')">
<h4>Not Interested</h4>
<h2 id="countNotInterested">0</h2>
</div>

<div class="card" onclick="filterLeads('Wrong / Invalid')">
<h4>Wrong</h4>
<h2 id="countWrong">0</h2>
</div>

<div class="card" onclick="filterLeads('Joined')">
<h4>Joined</h4>
<h2 id="countJoined">0</h2>
</div>

</div>
<div class="container">

    <!-- Current Lead Card -->
    <div class="card" id="leadCard">
        <h3 id="studentName">Loading...</h3>
        <p id="studentPhone"></p>

        <button class="copy-btn" onclick="copyNumber()">Copy & Start Call</button>

        <br><br>
<select id="statusSelect">
    <option value="New" selected>New</option>
    <option value="Interested/follow up">Interested / Follow Up</option>
    <option value="Not Received">Not Received</option>
    <option value="Not Interested">Not Interested</option>
    <option value="Switch Off">Switch Off</option>
    <option value="Wrong / Invalid">Wrong / Invalid</option>
    <option value="Joined">Joined</option>
</select>


        <br><br>

        <button class="status-btn" onclick="submitStatus()">Update Status</button>
    </div>

    <!-- Updated Leads Section -->
    <div style="margin-top:40px;">
        <h3>Today's Updated Leads</h3>
        <table width="100%" border="1" cellpadding="8" style="background:white;border-collapse:collapse;">
            <thead>
                <tr>
                   <th>Name</th>
<th>Phone</th>
<th>Status</th>
<th>Follow Up / Amount</th>
<th>Updated Time</th>

                </tr>
            </thead>
            <tbody id="updatedLeadsTable"></tbody>
        </table>
    </div>

</div>


</div>
<!-- Follow Up Modal -->
<div id="followUpModal" style="display:none; position:fixed; top:0; left:0;
width:100%; height:100%; background:rgba(0,0,0,0.5);
justify-content:center; align-items:center;">

    <div style="background:white; padding:20px; border-radius:8px; width:300px;">
        <h3>Select Follow Up</h3>

        <input type="date" id="followDate" style="width:100%; margin-bottom:10px;">
        <input type="time" id="followTime" style="width:100%; margin-bottom:10px;">

        <button onclick="confirmFollowUp()">Save</button>
        <button onclick="closeFollowUp()">Cancel</button>
    </div>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyB7xfwR2gBijRnVaasu_DZKuY8gLifimH0",
  authDomain: "dashboard-bd51c.firebaseapp.com",
  projectId: "dashboard-bd51c",
  storageBucket: "dashboard-bd51c.firebasestorage.app",
  messagingSenderId: "689809644516",
  appId: "1:689809644516:web:75d6051b300983afb545f1"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let agentUID=null;
let currentLeadId=null;
let currentPhone=null;
let callStartTime=null;
let pendingLeadId = null;
let pendingStatus = null;

auth.onAuthStateChanged(user=>{
    if(!user){
        window.location.href="index.html";
        return;
    }

    agentUID=user.uid;

    db.collection("users").doc(agentUID).get().then(doc=>{
        document.getElementById("agentName").innerText =
        doc.exists ? doc.data().name : "Agent";
    });

    db.collection("users").doc(agentUID).update({
        loginTime: firebase.firestore.FieldValue.serverTimestamp(),
        lastActive: firebase.firestore.FieldValue.serverTimestamp()
    });

    loadNextLead();
    loadUpdatedLeads();
    loadUpdatedLeads();

});

function logout(){
    auth.signOut().then(()=>window.location.href="index.html");
}

function loadNextLead(){

    db.collection("leads")
    .where("assignedTo","==",agentUID)
    .where("deleted","==",false)
    .where("status","==","New")
    .limit(1)
    .get()
    .then(snapshot=>{
        if(snapshot.empty){
            document.getElementById("leadCard").innerHTML="<h3>No More Leads</h3>";
            return;
        }

        const doc=snapshot.docs[0];
        const data=doc.data();

        currentLeadId=doc.id;
        currentPhone=data.phone;

        document.getElementById("studentName").innerText=data.studentName || "No Name";
        document.getElementById("studentPhone").innerText=data.phone;
    });
}
function loadUpdatedLeads(){

    db.collection("leads")
    .where("assignedTo","==",agentUID)
    .where("deleted","==",false)
    .onSnapshot(snapshot=>{

        const tableBody = document.getElementById("updatedLeadsTable");
        tableBody.innerHTML="";

        snapshot.forEach(doc=>{
            const d=doc.data();

            // Only show non-new leads
            if(d.status !== "New"){

                // Follow-up or Amount display
let followDisplay = "";

if(d.status === "Joined" && d.amount){
    followDisplay = "₹ " + d.amount;
}
else if(d.followUpTime){

    const now = Date.now();
    const diff = d.followUpTime - now;

    if(diff <= 0){
        followDisplay = "🔴 Due Now";
    } else {

        const totalMinutes = Math.floor(diff / (1000 * 60));
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;

        if(hours > 0){
            followDisplay = hours + "h " + minutes + "m left";
        } else {
            followDisplay = minutes + "m left";
        }
    }
}


const row = `
<tr>
<td>${d.studentName || ""}</td>
<td>${d.phone || ""}</td>
<td>
<select id="status_${doc.id}">
    ${generateStatusOptions(d.status)}
</select>
<button onclick="updateExistingStatus('${doc.id}')">Save</button>
</td>
<td>${followDisplay}</td>
<td>${d.updatedAt ? new Date(d.updatedAt.toDate()).toLocaleString() : ""}</td>
</tr>
`;





                tableBody.innerHTML += row;
            }
        });
    });
}


function copyNumber(){
    if(!currentPhone){
        alert("No lead loaded");
        return;
    }

    navigator.clipboard.writeText(currentPhone);
    callStartTime=new Date();

    db.collection("users").doc(agentUID).update({
        lastActive: firebase.firestore.FieldValue.serverTimestamp()
    });

    alert("Number copied. Call started.");
}
function generateStatusOptions(current){
    const statuses = [
        "Interested/follow up",
        "Not Received",
        "Not Interested",
        "Switch Off",
        "Wrong / Invalid",
        "Joined"
    ];

    return statuses.map(s =>
        `<option value="${s}" ${s===current ? "selected" : ""}>${s}</option>`
    ).join("");
}function updateExistingStatus(id){

    const select = document.getElementById("status_" + id);
    const newStatus = select.value;

    let updateData = {
        status: newStatus,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        followUpTime: null,
        amount: null
    };

    // 🎯 FOLLOW UP REQUIRED
    if(newStatus === "Interested/follow up"){

        const date = prompt("Enter follow-up date (YYYY-MM-DD):");
        if(!date) return;

        const time = prompt("Enter follow-up time (HH:MM):");
        if(!time) return;

        updateData.followUpTime = new Date(date + " " + time).getTime();
    }

    // 🎯 AUTO 6 HOUR TIMER
    if(newStatus === "Switch Off" || newStatus === "Not Received"){
        updateData.followUpTime = Date.now() + (6 * 60 * 60 * 1000);
    }

    // 🎯 JOINED
    if(newStatus === "Joined"){
        const amount = prompt("Enter amount:");
        if(!amount) return;
        updateData.amount = parseInt(amount);
    }

    db.collection("leads").doc(id).update(updateData);
}



function submitStatus(){

    const status = document.getElementById("statusSelect").value;

    if(status === "New"){
        alert("Please select a valid status before submitting.");
        return;
    }
    if(status === "Interested/follow up"){
    pendingLeadId = currentLeadId;
    pendingStatus = status;
    document.getElementById("followUpModal").style.display = "flex";
    return; // stop here until modal save
}


    if(!callStartTime){
        alert("You must copy number before updating status.");
        return;
    }

    const spokenMin = prompt("Enter spoken minutes:");
    const spokenSec = prompt("Enter spoken seconds:");

    if(spokenMin === null || spokenSec === null){
        return;
    }

    const spokenSeconds = (parseInt(spokenMin)*60) + parseInt(spokenSec);  // ✅ THIS WAS MISSING

    const callEnd = new Date();
    const realSeconds = Math.floor((callEnd - callStartTime)/1000);

    if(spokenSeconds > realSeconds){
        alert("Spoken time cannot exceed real time.");
        return;
    }

    db.collection("callLogs").add({
        agentId: agentUID,
        leadId: currentLeadId,
        numberCopiedTime: callStartTime,
        statusUpdatedTime: firebase.firestore.FieldValue.serverTimestamp(),
        spokenSeconds: spokenSeconds,
        realTimeSeconds: realSeconds
    });

let updateData = {
    status: status,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    followUpTime: null,
    amount: null
};

// 🎯 INTERESTED / FOLLOW UP
if(status === "Interested/follow up"){

    const date = prompt("Enter follow-up date (YYYY-MM-DD):");
    if(!date) return;

    const time = prompt("Enter follow-up time (HH:MM):");
    if(!time) return;

    updateData.followUpTime = new Date(date + " " + time).getTime();
}

// 🎯 AUTO 6 HOURS
if(status === "Switch Off" || status === "Not Received"){
    updateData.followUpTime = Date.now() + (6 * 60 * 60 * 1000);
}

// 🎯 JOINED
if(status === "Joined"){
    const amount = prompt("Enter amount:");
    if(!amount) return;
    updateData.amount = parseInt(amount);
}


    db.collection("leads").doc(currentLeadId).update(updateData)
    .then(()=>{
        callStartTime = null;
        document.getElementById("statusSelect").value = "New";
        loadNextLead();
        loadUpdatedLeads();
    });
}
    function confirmFollowUp(){

    const date = document.getElementById("followDate").value;
    const time = document.getElementById("followTime").value;

    if(!date || !time){
        alert("Select date and time");
        return;
    }

    const followTime = new Date(date + " " + time).getTime();

    db.collection("leads").doc(pendingLeadId).update({
        status: pendingStatus,
        followUpTime: followTime,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(()=>{
        closeFollowUp();
        loadNextLead();
        loadUpdatedLeads();
        loadStats();
    });
}

function closeFollowUp(){
    document.getElementById("followUpModal").style.display = "none";
}
setInterval(()=>{
    loadUpdatedLeads();
}, 60000);
function loadStats(){

    db.collection("leads")
    .where("assignedTo","==",agentUID)
    .where("deleted","==",false)
    .onSnapshot(snapshot=>{

        let counts = {
            assigned: 0,
            New: 0,
            "Interested/follow up": 0,
            "Not Received": 0,
            "Switch Off": 0,
            "Not Interested": 0,
            "Wrong / Invalid": 0,
            Joined: 0
        };

        snapshot.forEach(doc=>{
            const d = doc.data();
            counts.assigned++;
            if(counts[d.status] !== undefined){
                counts[d.status]++;
            }
        });

        document.getElementById("countAssigned").innerText = counts.assigned;
        document.getElementById("countNew").innerText = counts["New"];
        document.getElementById("countInterested").innerText = counts["Interested/follow up"];
        document.getElementById("countNotReceived").innerText = counts["Not Received"];
        document.getElementById("countSwitch").innerText = counts["Switch Off"];
        document.getElementById("countNotInterested").innerText = counts["Not Interested"];
        document.getElementById("countWrong").innerText = counts["Wrong / Invalid"];
        document.getElementById("countJoined").innerText = counts["Joined"];
    });
}
function filterLeads(status){

    db.collection("leads")
    .where("assignedTo","==",agentUID)
    .where("deleted","==",false)
    .onSnapshot(snapshot=>{

        const tableBody = document.getElementById("updatedLeadsTable");
        tableBody.innerHTML="";

        snapshot.forEach(doc=>{
            const d=doc.data();

            if(status!=="ALL" && d.status!==status) return;

            const followDisplay =
                d.status === "Joined" && d.amount
                ? "₹ "+d.amount
                : d.followUpTime
                    ? new Date(d.followUpTime).toLocaleString()
                    : "";

            const row = `
            <tr>
            <td>${d.studentName || ""}</td>
            <td>${d.phone || ""}</td>
            <td>${d.status}</td>
            <td>${followDisplay}</td>
            </tr>
            `;

            tableBody.innerHTML+=row;
        });
    });
}

</script>

</body>
</html>
