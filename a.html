<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HIS Academy - Agent Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f6f9;
}
.header{
    background:linear-gradient(90deg,#1e3c72,#2a5298);
    color:white;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.container{ padding:30px; }

.card{
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
    max-width:500px;
    margin:auto;
    text-align:center;
}

button{
    padding:10px 20px;
    margin:5px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.copy-btn{ background:#2a5298;color:white; }
.status-btn{ background:#28a745;color:white; }
</style>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>

<body>

<div class="header">
<h2>HIS Academy - Calling Mode</h2>
<div>
Welcome, <b id="agentName">Agent</b>
<button onclick="logout()">Logout<button>
</div>
</div>

<div class="container">

<div class="container">

    <!-- Current Lead Card -->
    <div class="card" id="leadCard">
        <h3 id="studentName">Loading...</h3>
        <p id="studentPhone"></p>

        <button class="copy-btn" onclick="copyNumber()">Copy & Start Call</button>

        <br><br>
<select id="statusSelect">
    <option value="New" selected>New</option>
    <option value="Interested/follow up">Interested / Follow Up</option>
    <option value="Not Received">Not Received</option>
    <option value="Not Interested">Not Interested</option>
    <option value="Switch Off">Switch Off</option>
    <option value="Wrong / Invalid">Wrong / Invalid</option>
    <option value="Joined">Joined</option>
</select>


        <br><br>

        <button class="status-btn" onclick="submitStatus()">Update Status</button>
    </div>

    <!-- Updated Leads Section -->
    <div style="margin-top:40px;">
        <h3>Today's Updated Leads</h3>
        <table width="100%" border="1" cellpadding="8" style="background:white;border-collapse:collapse;">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Status</th>
                    <th>Updated Time</th>
                </tr>
            </thead>
            <tbody id="updatedLeadsTable"></tbody>
        </table>
    </div>

</div>


</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyB7xfwR2gBijRnVaasu_DZKuY8gLifimH0",
  authDomain: "dashboard-bd51c.firebaseapp.com",
  projectId: "dashboard-bd51c",
  storageBucket: "dashboard-bd51c.firebasestorage.app",
  messagingSenderId: "689809644516",
  appId: "1:689809644516:web:75d6051b300983afb545f1"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let agentUID=null;
let currentLeadId=null;
let currentPhone=null;
let callStartTime=null;

auth.onAuthStateChanged(user=>{
    if(!user){
        window.location.href="index.html";
        return;
    }

    agentUID=user.uid;

    db.collection("users").doc(agentUID).get().then(doc=>{
        document.getElementById("agentName").innerText =
        doc.exists ? doc.data().name : "Agent";
    });

    db.collection("users").doc(agentUID).update({
        loginTime: firebase.firestore.FieldValue.serverTimestamp(),
        lastActive: firebase.firestore.FieldValue.serverTimestamp()
    });

    loadNextLead();
    loadUpdatedLeads();

});

function logout(){
    auth.signOut().then(()=>window.location.href="index.html");
}

function loadNextLead(){

    db.collection("leads")
    .where("assignedTo","==",agentUID)
    .where("deleted","==",false)
    .where("status","==","New")
    .limit(1)
    .get()
    .then(snapshot=>{
        if(snapshot.empty){
            document.getElementById("leadCard").innerHTML="<h3>No More Leads</h3>";
            return;
        }

        const doc=snapshot.docs[0];
        const data=doc.data();

        currentLeadId=doc.id;
        currentPhone=data.phone;

        document.getElementById("studentName").innerText=data.studentName || "No Name";
        document.getElementById("studentPhone").innerText=data.phone;
    });
}
function loadUpdatedLeads(){

    db.collection("leads")
    .where("assignedTo","==",agentUID)
    .where("deleted","==",false)
    .onSnapshot(snapshot=>{

        const tableBody = document.getElementById("updatedLeadsTable");
        tableBody.innerHTML="";

        snapshot.forEach(doc=>{
            const d=doc.data();

            // Only show non-new leads
            if(d.status !== "New"){

                const row = `
                    <tr>
                        <td>${d.studentName || ""}</td>
                        <td>${d.phone || ""}</td>
                        <td>${d.status || ""}</td>
                        <td>${d.updatedAt ? new Date(d.updatedAt.toDate()).toLocaleString() : ""}</td>
                    </tr>
                `;

                tableBody.innerHTML += row;
            }
        });
    });
}


function copyNumber(){
    if(!currentPhone){
        alert("No lead loaded");
        return;
    }

    navigator.clipboard.writeText(currentPhone);
    callStartTime=new Date();

    db.collection("users").doc(agentUID).update({
        lastActive: firebase.firestore.FieldValue.serverTimestamp()
    });

    alert("Number copied. Call started.");
}

function submitStatus(){

    const status = document.getElementById("statusSelect").value;

    if(status === "New"){
        alert("Please select a valid status before submitting.");
        return;
    }

    if(!callStartTime){
        alert("You must copy number before updating status.");
        return;
    }

    const spokenMin = prompt("Enter spoken minutes:");
    const spokenSec = prompt("Enter spoken seconds:");

    if(spokenMin === null || spokenSec === null){
        return;
    }

    const spokenSeconds = (parseInt(spokenMin)*60) + parseInt(spokenSec);  // ✅ THIS WAS MISSING

    const callEnd = new Date();
    const realSeconds = Math.floor((callEnd - callStartTime)/1000);

    if(spokenSeconds > realSeconds){
        alert("Spoken time cannot exceed real time.");
        return;
    }

    db.collection("callLogs").add({
        agentId: agentUID,
        leadId: currentLeadId,
        numberCopiedTime: callStartTime,
        statusUpdatedTime: firebase.firestore.FieldValue.serverTimestamp(),
        spokenSeconds: spokenSeconds,
        realTimeSeconds: realSeconds
    });

    let updateData = {
        status: status,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    if(status === "Switch Off"){
        updateData.followUpTime = Date.now() + (12*60*60*1000);
    }

    if(status === "Not Received"){
        updateData.followUpTime = Date.now() + (6*60*60*1000);
    }

    if(status === "Joined"){
        const amount = prompt("Enter amount:");
        if(!amount){
            return;
        }
        updateData.amount = parseInt(amount);
    }

    db.collection("leads").doc(currentLeadId).update(updateData)
    .then(()=>{
        callStartTime = null;
        document.getElementById("statusSelect").value = "New";
        loadNextLead();
        loadUpdatedLeads();
    });
}


</script>

</body>
</html>
