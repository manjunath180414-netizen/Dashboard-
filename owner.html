<!DOCTYPE html>
<html>
<head>
  <title>Owner Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    body {
      margin:0;
      font-family: Arial;
      background:#0f172a;
      color:white;
    }

    .header {
      background:#1e293b;
      padding:15px 25px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .header h2 {
      margin:0;
    }

    .logout-btn {
      background:#ef4444;
      padding:8px 15px;
      border:none;
      color:white;
      border-radius:5px;
      cursor:pointer;
    }

    .dashboard {
      padding:30px;
    }

    .card-container {
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap:20px;
      margin-top:20px;
    }

    .card {
      background:#1e293b;
      padding:25px;
      border-radius:10px;
      text-align:center;
      box-shadow:0 0 15px rgba(0,0,0,0.3);
    }

    .card h3 {
      margin:0;
      font-size:18px;
      color:#94a3b8;
    }

    .card p {
      font-size:28px;
      margin:10px 0 0 0;
      font-weight:bold;
    }

  </style>
</head>

<body>

<div class="header">
  <h2>HIS Academy CRM - Owner Panel</h2>
  <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div class="dashboard">

  <h3>Overview</h3>

  <div class="card-container">

    <div class="card">
      <h3>Total Leads</h3>
      <p id="totalLeads">0</p>
    </div>

    <div class="card">
      <h3>Interested</h3>
      <p id="interested">0</p>
    </div>

    <div class="card">
      <h3>Not Interested</h3>
      <p id="notInterested">0</p>
    </div>

    <div class="card">
      <h3>Call Back</h3>
      <p id="callBack">0</p>
    </div>

  </div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyB7xfwR2gBijRnVaasu_DZKuY8gLifimH0",
  authDomain: "dashboard-bd51c.firebaseapp.com",
  projectId: "dashboard-bd51c",
  storageBucket: "dashboard-bd51c.firebasestorage.app",
  messagingSenderId: "689809644516",
  appId: "1:689809644516:web:75d6051b300983afb545f1",
  measurementId: "G-5GWRNP2F9K"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// Protect page
auth.onAuthStateChanged(user => {

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  db.collection("users").doc(user.uid).get()
  .then(doc => {
      if (!doc.exists || doc.data().role !== "owner") {
        window.location.href = "index.html";
      }
  });

});

// Load Lead Stats
db.collection("leads").onSnapshot(snapshot => {

  let total = 0;
  let interested = 0;
  let notInterested = 0;
  let callBack = 0;

  snapshot.forEach(doc => {
    total++;

    const status = doc.data().status;

    if (status === "Interested") interested++;
    if (status === "Not Interested") notInterested++;
    if (status === "Call Back") callBack++;
  });

  document.getElementById("totalLeads").innerText = total;
  document.getElementById("interested").innerText = interested;
  document.getElementById("notInterested").innerText = notInterested;
  document.getElementById("callBack").innerText = callBack;

});

// Logout
function logout(){
  auth.signOut().then(() => {
    window.location.href = "index.html";
  });
}

</script>

</body>
</html>
