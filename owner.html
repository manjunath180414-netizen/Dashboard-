<!DOCTYPE html>
<html>
<head>
  <title>Owner Dashboard - HIS CRM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0f172a;
      color:white;
    }

    header{
      background:#1e293b;
      padding:15px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .container{
      padding:20px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
      gap:15px;
      margin-bottom:30px;
    }

    .card{
      background:#1e293b;
      padding:20px;
      border-radius:10px;
      text-align:center;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:#1e293b;
      margin-top:20px;
    }

    th,td{
      padding:12px;
      border-bottom:1px solid #334155;
      text-align:center;
    }

    th{
      background:#111827;
    }

    button{
      padding:8px 15px;
      border:none;
      border-radius:5px;
      cursor:pointer;
      background:#ef4444;
      color:white;
    }
  </style>
</head>

<body>

<header>
  <h2>Owner Dashboard</h2>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">

  <!-- STAT CARDS -->
  <div class="cards">
    <div class="card">
      <h3>Total Leads</h3>
      <h2 id="totalLeads">0</h2>
    </div>
    <div class="card">
      <h3>Interested</h3>
      <h2 id="interested">0</h2>
    </div>
    <div class="card">
      <h3>Joined</h3>
      <h2 id="joined">0</h2>
    </div>
    <div class="card">
      <h3>Revenue</h3>
      <h2 id="revenue">₹0</h2>
    </div>
  </div>

  <!-- AGENT PERFORMANCE TABLE -->
  <h3>Agent Performance</h3>
  <table>
    <thead>
      <tr>
        <th>Agent</th>
        <th>Total Leads</th>
        <th>Interested</th>
        <th>Joined</th>
      </tr>
    </thead>
    <tbody id="agentTable">
    </tbody>
  </table>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyB7xfwR2gBijRnVaasu_DZKuY8gLifimH0",
  authDomain: "dashboard-bd51c.firebaseapp.com",
  projectId: "dashboard-bd51c",
  storageBucket: "dashboard-bd51c.firebasestorage.app",
  messagingSenderId: "689809644516",
  appId: "1:689809644516:web:75d6051b300983afb545f1"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();


// Protect Route (Only Owner Access)
auth.onAuthStateChanged(user=>{
  if(!user){
    window.location.href="index.html";
  }else{
    db.collection("users").doc(user.uid).get()
    .then(doc=>{
        if(doc.data().role !== "owner"){
            alert("Access Denied");
            window.location.href="index.html";
        }
        else{
            loadDashboard();
        }
    });
  }
});


function loadDashboard(){

  let totalLeads=0;
  let interested=0;
  let joined=0;
  let revenue=0;

  db.collection("leads").onSnapshot(snapshot=>{

    totalLeads=snapshot.size;
    interested=0;
    joined=0;
    revenue=0;

    snapshot.forEach(doc=>{
      const data=doc.data();

      if(data.status==="Interested") interested++;
      if(data.status==="Joined"){
          joined++;
          revenue += data.amount || 0;
      }
    });

    document.getElementById("totalLeads").innerText=totalLeads;
    document.getElementById("interested").innerText=interested;
    document.getElementById("joined").innerText=joined;
    document.getElementById("revenue").innerText="₹"+revenue;
  });

  loadAgentPerformance();
}


// Agent Performance
function loadAgentPerformance(){

  db.collection("users").where("role","==","agent")
  .onSnapshot(snapshot=>{

    let html="";

    snapshot.forEach(userDoc=>{
      const agentId=userDoc.id;
      const agentName=userDoc.data().name;

      db.collection("leads")
      .where("assignedTo","==",agentId)
      .get()
      .then(leadSnap=>{

        let total=leadSnap.size;
        let interested=0;
        let joined=0;

        leadSnap.forEach(lead=>{
          const data=lead.data();
          if(data.status==="Interested") interested++;
          if(data.status==="Joined") joined++;
        });

        html+=`
          <tr>
            <td>${agentName}</td>
            <td>${total}</td>
            <td>${interested}</td>
            <td>${joined}</td>
          </tr>
        `;

        document.getElementById("agentTable").innerHTML=html;

      });

    });

  });

}


// Logout
function logout(){
  auth.signOut().then(()=>{
    window.location.href="index.html";
  });
}

</script>

</body>
</html>
