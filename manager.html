
    <!DOCTYPE html>
<html>
<head>
  <title>HIS Academy - Manager Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    body{
      margin:0;
      font-family:Segoe UI, sans-serif;
      background:#0f172a;
      color:white;
    }

    header{
      padding:15px 20px;
      background:#1e293b;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .container{
      padding:20px;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
      gap:15px;
      margin-bottom:25px;
    }

    .card{
      background:#1e293b;
      padding:15px;
      border-radius:10px;
      text-align:center;
      cursor:pointer;
    }

    .card span{
      font-size:20px;
      font-weight:bold;
      display:block;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:15px;
      background:#1e293b;
      border-radius:10px;
      overflow:hidden;
    }

    th, td{
      padding:10px;
      border-bottom:1px solid #334155;
      text-align:center;
    }

    th{
      background:#111827;
    }

    select, button{
      padding:5px 8px;
      border:none;
      border-radius:5px;
      cursor:pointer;
    }

    button{
      background:#2563eb;
      color:white;
    }

  </style>
</head>

<body>

<header>
  <div>
    <h3>HIS Academy - Manager Dashboard</h3>
    <div id="welcome"></div>
  </div>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">

  <!-- SUMMARY -->
  <div class="stats">
    <div class="card"><span id="total">0</span>Total</div>
    <div class="card"><span id="unassigned">0</span>Unassigned</div>
    <div class="card"><span id="interested">0</span>Interested</div>
    <div class="card"><span id="followup">0</span>Follow Up</div>
    <div class="card"><span id="joined">0</span>Joined</div>
    <div class="card"><span id="revenue">₹0</span>Revenue</div>
  </div>

  <!-- AGENT PERFORMANCE -->
  <h3>Agent Performance</h3>
  <table>
    <thead>
      <tr>
        <th>Agent</th>
        <th>Assigned</th>
        <th>Interested</th>
        <th>Follow Up</th>
        <th>Joined</th>
        <th>Revenue</th>
      </tr>
    </thead>
    <tbody id="agentTable"></tbody>
  </table>

  <!-- BULK ASSIGN -->
  <h3>Bulk Assign</h3>
  <select id="agentSelect"></select>
  <button onclick="bulkAssign()">Assign Selected</button>

  <!-- LEADS TABLE -->
  <h3>All Leads</h3>
  <table>
    <thead>
      <tr>
        <th>Select</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Agent</th>
        <th>Status</th>
        <th>Amount</th>
        <th>FollowUp</th>
      </tr>
    </thead>
    <tbody id="leadTable"></tbody>
  </table>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyB7xfwR2gBijRnVaasu_DZKuY8gLifimH0",
  authDomain: "dashboard-bd51c.firebaseapp.com",
  projectId: "dashboard-bd51c",
  storageBucket: "dashboard-bd51c.firebasestorage.app",
  messagingSenderId: "689809644516",
  appId: "1:689809644516:web:75d6051b300983afb545f1"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let selectedLeads=[];

auth.onAuthStateChanged(user=>{
  if(!user){
    window.location.href="index.html";
  }else{
    db.collection("users").doc(user.uid).get().then(doc=>{
      if(!doc.exists || doc.data().role !== "manager"){
        window.location.href="index.html";
      }else{
        document.getElementById("welcome").innerText="Welcome, "+doc.data().name;
        loadAgents();
        loadLeads();
      }
    });
  }
});

function loadLeads(){

  db.collection("leads").onSnapshot(snapshot=>{

    let total=0, unassigned=0, interested=0, followup=0, joined=0, revenue=0;
    let html="";
    selectedLeads=[];

    snapshot.forEach(doc=>{
      const data=doc.data();
      total++;

      if(!data.assignedTo) unassigned++;
      if(data.status==="Interested") interested++;
      if(data.status==="Follow up") followup++;
      if(data.status==="Joined"){
        joined++;
        revenue += data.amount || 0;
      }

      let followTime=data.followUpTime 
        ? new Date(data.followUpTime).toLocaleTimeString()
        : "--";

      html+=`
        <tr>
          <td><input type="checkbox" onchange="toggleSelect('${doc.id}',this)"></td>
          <td>${data.studentName}</td>
          <td>${data.phone}</td>
          <td>${data.assignedTo || "Unassigned"}</td>
          <td>${data.status || "New"}</td>
          <td>${data.amount || 0}</td>
          <td>${followTime}</td>
        </tr>
      `;
    });

    document.getElementById("leadTable").innerHTML=html;
    document.getElementById("total").innerText=total;
    document.getElementById("unassigned").innerText=unassigned;
    document.getElementById("interested").innerText=interested;
    document.getElementById("followup").innerText=followup;
    document.getElementById("joined").innerText=joined;
    document.getElementById("revenue").innerText="₹"+revenue;

    updateAgentPerformance(snapshot);

  });
}

function loadAgents(){
  db.collection("users")
  .where("role","==","agent")
  .get()
  .then(snapshot=>{
    let options="";
    snapshot.forEach(doc=>{
      options+=`<option value="${doc.id}">${doc.data().name}</option>`;
    });
    document.getElementById("agentSelect").innerHTML=options;
  });
}

function updateAgentPerformance(snapshot){

  db.collection("users")
  .where("role","==","agent")
  .get()
  .then(agentSnap=>{

    let html="";

    agentSnap.forEach(agent=>{
      let assigned=0, interested=0, followup=0, joined=0, revenue=0;

      snapshot.forEach(doc=>{
        let data=doc.data();
        if(data.assignedTo===agent.id){
          assigned++;
          if(data.status==="Interested") interested++;
          if(data.status==="Follow up") followup++;
          if(data.status==="Joined"){
            joined++;
            revenue+=data.amount||0;
          }
        }
      });

      html+=`
        <tr>
          <td>${agent.data().name}</td>
          <td>${assigned}</td>
          <td>${interested}</td>
          <td>${followup}</td>
          <td>${joined}</td>
          <td>₹${revenue}</td>
        </tr>
      `;
    });

    document.getElementById("agentTable").innerHTML=html;

  });
}

function toggleSelect(id,checkbox){
  if(checkbox.checked){
    selectedLeads.push(id);
  }else{
    selectedLeads=selectedLeads.filter(l=>l!==id);
  }
}

function bulkAssign(){
  const agent=document.getElementById("agentSelect").value;
  selectedLeads.forEach(id=>{
    db.collection("leads").doc(id).update({
      assignedTo:agent
    });
  });
  alert("Assigned Successfully");
}

function logout(){
  auth.signOut().then(()=>window.location.href="index.html");
}

</script>

</body>
</html>
