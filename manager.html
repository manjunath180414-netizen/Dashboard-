<!DOCTYPE html>
<html>
<head>
  <title>HIS Academy - Manager Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    body{
      margin:0;
      font-family:Segoe UI, sans-serif;
      background:#0f172a;
      color:white;
      display:flex;
    }

    .sidebar{
      width:220px;
      background:#111827;
      height:100vh;
      padding:20px;
      box-sizing:border-box;
      position:fixed;
    }

    .sidebar h2{
      margin-bottom:30px;
    }

    .sidebar div{
      padding:10px;
      margin-bottom:10px;
      cursor:pointer;
      border-radius:6px;
    }

    .sidebar div:hover{
      background:#2563eb;
    }

    .main{
      margin-left:220px;
      padding:20px;
      flex:1;
    }

    .card{
      background:#1e293b;
      padding:20px;
      border-radius:10px;
      margin-bottom:20px;
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    th, td{
      padding:10px;
      border-bottom:1px solid #334155;
      text-align:left;
    }

    button{
      padding:6px 10px;
      border:none;
      border-radius:6px;
      cursor:pointer;
      background:#2563eb;
      color:white;
    }

    .hidden{
      display:none;
    }

    @media(max-width:768px){
      .sidebar{
        position:relative;
        width:100%;
        height:auto;
      }
      .main{
        margin-left:0;
      }
    }
  </style>
</head>

<body>

<div class="sidebar">
  <h2>Manager Portal</h2>
  <div onclick="showSection('dashboard')">Dashboard</div>
  <div onclick="showSection('leads')">Leads</div>
  <div onclick="logout()">Logout</div>
</div>

<div class="main">

  <h2 id="welcomeText"></h2>

  <!-- DASHBOARD -->
  <div id="dashboardSection">

    <div class="card">
      <h3>Total Leads</h3>
      <h2 id="totalLeads">0</h2>
    </div>

    <div class="card">
      <h3>Joined</h3>
      <h2 id="totalJoined">0</h2>
    </div>

    <div class="card">
      <h3>Revenue</h3>
      <h2 id="totalRevenue">₹0</h2>
    </div>

  </div>

  <!-- LEADS -->
  <div id="leadsSection" class="hidden">
<!-- LEAD DETAIL VIEW -->
    <div class="card">
  <h3>Add New Lead</h3>
  <input type="text" id="newName" placeholder="Student Name">
  <input type="text" id="newPhone" placeholder="Phone">
  <input type="text" id="newCourse" placeholder="Course">
  <button onclick="addLead()">Add Lead</button>
</div>
    <div class="card">
  <h3>Upload CSV Leads</h3>
  <input type="file" id="csvFile" accept=".csv">
  <button onclick="uploadCSV()">Upload</button>
  <p id="csvStatus"></p>
</div>


<div id="leadDetailSection" class="hidden">

  <button onclick="goBack()">⬅ Back to Leads</button>

  <div class="card">
    <h2 id="detailName"></h2>
    <p id="detailPhone"></p>
    <p id="detailStatus"></p>
    <p id="detailAgent"></p>
    <p id="detailAmount"></p>
  </div>
  <div class="card">
    <h3>Actions</h3>
    <select id="statusChange">
      <option value="">Change Status</option>
      <option>New</option>
      <option>Interested</option>
      <option>Follow Up</option>
      <option>Joined</option>
      <option>Not Interested</option>
      <option>Wrong Number</option>

      <h4>Reassign Agent</h4>
<select id="agentChange">
  <option value="">Select Agent</option>
    </select>

    <button onclick="updateStatus()">Update</button>
    <button onclick="resetLead()">Reset as New</button>
    <button onclick="softDelete()">Soft Delete</button>
      <button onclick="reassignAgent()">Reassign</button>

  </div>
<hr style="margin:15px 0;">
  

  <div class="card">
    <h3>Activity Timeline</h3>
    <div id="historyContainer"></div>
  </div>

</div>

    <div class="card">
      <input type="text" id="searchInput" placeholder="Search by name or phone" onkeyup="searchLeads()" />
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Status</th>
            <th>Agent</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody id="leadTable"></tbody>
      </table>
    </div>

    <div>
      <button onclick="previousPage()">Previous</button>
      <button onclick="nextPage()">Next</button>
    </div>

  </div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyB7xfwR2gBijRnVaasu_DZKuY8gLifimH0",
  authDomain: "dashboard-bd51c.firebaseapp.com",
  projectId: "dashboard-bd51c",
  storageBucket: "dashboard-bd51c.firebasestorage.app",
  messagingSenderId: "689809644516",
  appId: "1:689809644516:web:75d6051b300983afb545f1"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let lastVisible = null;
let firstVisible = null;
let pageStack = [];
let agentMap = {};

auth.onAuthStateChanged(user=>{
  if(!user){
    window.location.href="index.html";
  } else {
    db.collection("users").doc(user.uid).get().then(doc=>{
      if(doc.data().role !== "manager"){
        window.location.href="index.html";
      } else {
        document.getElementById("welcomeText").innerText = "Welcome, " + doc.data().name;
        function preloadAgents(){

  db.collection("users")
  .where("role","==","agent")
  .get()
  .then(snapshot=>{
    snapshot.forEach(doc=>{
      agentMap[doc.id] = doc.data().name;
    });
  });

}
        preloadAgents();
        loadDashboard();
        loadLeads();
        checkRouting();

      }
    });
  }
});

function showSection(section){
  document.getElementById("dashboardSection").classList.add("hidden");
  document.getElementById("leadsSection").classList.add("hidden");
  document.getElementById(section+"Section").classList.remove("hidden");
}

function loadDashboard(){
  db.collection("leads").onSnapshot(snapshot=>{
    let total=0, joined=0, revenue=0;

    snapshot.forEach(doc=>{
      const data=doc.data();
      if(data.deleted) return;

      total++;
      if(data.status==="Joined"){
        joined++;
        revenue += data.amount || 0;
      }
    });

    document.getElementById("totalLeads").innerText = total;
    document.getElementById("totalJoined").innerText = joined;
    document.getElementById("totalRevenue").innerText = "₹"+revenue;
  });
}

function loadLeads(){

  db.collection("leads")
  .orderBy("createdAt","desc")
  .limit(25)
  .get()
  .then(snapshot=>{
    renderLeads(snapshot);
    lastVisible = snapshot.docs[snapshot.docs.length-1];
  });

}

function renderLeads(snapshot){

  const table = document.getElementById("leadTable");
  table.innerHTML = "";

  snapshot.forEach(doc=>{
    const data = doc.data();
    if(data.deleted) return;

    table.innerHTML += `
      <tr onclick="openLead('${doc.id}')">
        <td>${data.studentName}</td>
        <td>${data.phone}</td>
        <td>${data.status}</td>
     <td>${agentMap[data.assignedTo] || "Unassigned"}</td>

        <td>${data.amount || 0}</td>
      </tr>
    `;
  });
}

function nextPage(){
  if(!lastVisible) return;

  db.collection("leads")
  .orderBy("createdAt","desc")
  .startAfter(lastVisible)
  .limit(25)
  .get()
  .then(snapshot=>{
    if(snapshot.empty) return;
    pageStack.push(lastVisible);
    renderLeads(snapshot);
    lastVisible = snapshot.docs[snapshot.docs.length-1];
  });
}

function previousPage(){
  if(pageStack.length === 0) return;

  const previous = pageStack.pop();

  db.collection("leads")
  .orderBy("createdAt","desc")
  .startAt(previous)
  .limit(25)
  .get()
  .then(snapshot=>{
    renderLeads(snapshot);
    lastVisible = snapshot.docs[snapshot.docs.length-1];
  });
}

function openLead(id){
  window.location.href = "manager.html?lead=" + id;
}

function searchLeads(){
  const input = document.getElementById("searchInput").value.toLowerCase();
  const rows = document.querySelectorAll("#leadTable tr");

  rows.forEach(row=>{
    row.style.display = row.innerText.toLowerCase().includes(input) ? "" : "none";
  });
}

function logout(){
  auth.signOut().then(()=>{
    window.location.href="index.html";
  });
}
function checkRouting(){
  const params = new URLSearchParams(window.location.search);
  const leadId = params.get("lead");

  if(leadId){
    showLeadDetail(leadId);
  }
}
  function showLeadDetail(id){

  document.getElementById("dashboardSection").classList.add("hidden");
  document.getElementById("leadsSection").classList.add("hidden");
  document.getElementById("leadDetailSection").classList.remove("hidden");

  db.collection("leads").doc(id).get().then(doc=>{
    const data = doc.data();

    document.getElementById("detailName").innerText = data.studentName;
    document.getElementById("detailPhone").innerText = "Phone: " + data.phone;
    document.getElementById("detailStatus").innerText = "Status: " + data.status;
    document.getElementById("detailAgent").innerText = "Agent: " + (data.assignedTo || "Unassigned");
    document.getElementById("detailAmount").innerText = "Amount: ₹" + (data.amount || 0);

    loadHistory(id);
    loadAgentsDropdown();

  });

}

function loadHistory(leadId){

  const container = document.getElementById("historyContainer");
  container.innerHTML = "Loading...";

  db.collection("leads")
  .doc(leadId)
  .collection("history")
  .orderBy("timestamp","desc")
  .onSnapshot(snapshot=>{

    container.innerHTML = "";

    snapshot.forEach(doc=>{
      const data = doc.data();

      const time = data.timestamp ? new Date(data.timestamp.seconds*1000).toLocaleString() : "";

      container.innerHTML += `
        <div style="margin-bottom:15px;padding:10px;background:#0f172a;border-left:3px solid #2563eb;">
          <b>${data.changedByName}</b> (${data.role})<br>
          Action: ${data.actionType}<br>
          From: ${data.oldValue || "-"} → To: ${data.newValue || "-"}<br>
          <small>${time}</small>
        </div>
      `;
    });

  });

}
function logHistory(leadId, actionType, oldValue, newValue){

  const user = firebase.auth().currentUser;

  db.collection("users").doc(user.uid).get().then(userDoc=>{

    db.collection("leads")
    .doc(leadId)
    .collection("history")
    .add({
      changedByUID: user.uid,
      changedByName: userDoc.data().name,
      role: userDoc.data().role,
      actionType: actionType,
      oldValue: oldValue || null,
      newValue: newValue || null,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });

  });

}
  function updateStatus(){

  const params = new URLSearchParams(window.location.search);
  const leadId = params.get("lead");

  const newStatus = document.getElementById("statusChange").value;
  if(!newStatus) return;

  db.collection("leads").doc(leadId).get().then(doc=>{
    const oldStatus = doc.data().status;

    db.collection("leads").doc(leadId).update({
      status:newStatus,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(()=>{
      logHistory(leadId,"status_change",oldStatus,newStatus);
      showLeadDetail(leadId);
    });

  });

}
function resetLead(){

  const params = new URLSearchParams(window.location.search);
  const leadId = params.get("lead");

  db.collection("leads").doc(leadId).update({
    status:"New",
    assignedTo:null
  }).then(()=>{
    logHistory(leadId,"lead_reset",null,"New");
    showLeadDetail(leadId);
  });

}
function softDelete(){

  const params = new URLSearchParams(window.location.search);
  const leadId = params.get("lead");

  db.collection("leads").doc(leadId).update({
    deleted:true
  }).then(()=>{
    logHistory(leadId,"lead_deleted",null,"soft_deleted");
    window.location.href="manager.html";
  });

}
function goBack(){
  window.location.href="manager.html";
}
function loadAgentsDropdown(){

  const select = document.getElementById("agentChange");
  select.innerHTML = '<option value="">Select Agent</option>';

  db.collection("users")
  .where("role","==","agent")
  .get()
  .then(snapshot=>{
    snapshot.forEach(doc=>{
      const data = doc.data();
      select.innerHTML += `
        <option value="${doc.id}">${data.name}</option>
      `;
    });
  });

}
function reassignAgent(){

  const params = new URLSearchParams(window.location.search);
  const leadId = params.get("lead");

  const newAgent = document.getElementById("agentChange").value;
  if(!newAgent) return;

  db.collection("leads").doc(leadId).get().then(doc=>{

    const oldAgent = doc.data().assignedTo || "Unassigned";

    db.collection("leads").doc(leadId).update({
      assignedTo: newAgent,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(()=>{

      logHistory(leadId,"assignment_change",oldAgent,newAgent);
      showLeadDetail(leadId);

    });

  });

}
  function addLead(){

  const name = document.getElementById("newName").value;
  const phone = document.getElementById("newPhone").value;
  const course = document.getElementById("newCourse").value;

  if(!name || !phone){
    alert("Enter Name & Phone");
    return;
  }

  db.collection("leads").add({
    studentName: name,
    phone: phone,
    course: course || "",
    status: "New",
    assignedTo: null,
    amount: 0,
    deleted: false,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(docRef=>{
    logHistory(docRef.id,"lead_created",null,"New");
    alert("Lead Added");
    document.getElementById("newName").value="";
    document.getElementById("newPhone").value="";
    document.getElementById("newCourse").value="";
    loadLeads();
  });

}
 function uploadCSV(){

  const fileInput = document.getElementById("csvFile");
  const statusText = document.getElementById("csvStatus");

  if(!fileInput.files.length){
    alert("Select a CSV file");
    return;
  }

  const file = fileInput.files[0];
  const reader = new FileReader();

  reader.onload = function(e){

    const text = e.target.result;
    const rows = text.split("\n");

    let leadsToAdd = [];
    let phoneSet = new Set();

    rows.forEach(row=>{
      const cols = row.split(",");

      if(cols.length < 2) return;

      const name = cols[0].trim();
      let phone = cols[1].trim();

      phone = phone.replace(/\D/g, "");

      if(phone.length < 10) return;

      if(!phoneSet.has(phone)){
        phoneSet.add(phone);
        leadsToAdd.push({
          studentName: name,
          phone: phone
        });
      }
    });

    removeExistingNumbers(leadsToAdd);

  };

  reader.readAsText(file);
}

function removeExistingNumbers(leads){

  const statusText = document.getElementById("csvStatus");
  statusText.innerText = "Checking duplicates...";

  db.collection("leads").get().then(snapshot=>{

    let existingNumbers = new Set();

    snapshot.forEach(doc=>{
      const data = doc.data();
      if(data.phone){
        existingNumbers.add(data.phone);
      }
    });

    let finalLeads = leads.filter(lead => !existingNumbers.has(lead.phone));

    addBulkLeads(finalLeads);

  });

}
function addBulkLeads(leads){

  const statusText = document.getElementById("csvStatus");

  if(leads.length === 0){
    statusText.innerText = "No new leads found (duplicates removed)";
    return;
  }

  const batch = db.batch();

  leads.forEach(lead=>{
    const ref = db.collection("leads").doc();
    batch.set(ref,{
      studentName: lead.studentName,
      phone: lead.phone,
      course: "",
      status: "New",
      assignedTo: null,
      amount: 0,
      deleted: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  });

  batch.commit().then(()=>{
    statusText.innerText = leads.length + " leads added successfully";
    loadLeads();
  });

}


</script>

</body>
</html>
