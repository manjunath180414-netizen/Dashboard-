<!DOCTYPE html>
<html>
<head>
  <title>Manager Dashboard - HIS CRM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0f172a;
      color:white;
    }

    header{
      background:#1e293b;
      padding:15px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .container{
      padding:20px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:10px;
      margin-bottom:20px;
    }

    .card{
      background:#1e293b;
      padding:15px;
      border-radius:8px;
      text-align:center;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:15px;
      background:#1e293b;
    }

    th,td{
      padding:10px;
      border-bottom:1px solid #334155;
      text-align:center;
    }

    th{
      background:#111827;
    }

    input,select{
      padding:8px;
      margin:5px;
      border-radius:5px;
      border:none;
    }

    button{
      padding:8px 12px;
      border:none;
      border-radius:5px;
      cursor:pointer;
      background:#2563eb;
      color:white;
      margin:5px;
    }

    .section{
      margin-bottom:30px;
    }

  </style>
</head>

<body>

<header>
  <h3>Manager Dashboard</h3>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">

  <!-- STATS -->
  <div class="cards">
    <div class="card">Total Leads<br><span id="total">0</span></div>
    <div class="card">Unassigned<br><span id="unassigned">0</span></div>
    <div class="card">Interested<br><span id="interested">0</span></div>
    <div class="card">Joined<br><span id="joined">0</span></div>
    <div class="card">Revenue<br><span id="revenue">0</span></div>
  </div>

  <!-- ADD LEAD -->
  <div class="section">
    <h3>Add Lead</h3>
    <input type="text" id="name" placeholder="Student Name">
    <input type="text" id="phone" placeholder="Phone">
    <input type="text" id="course" placeholder="Course">
    <button onclick="addLead()">Add</button>
  </div>

  <!-- AGENT PERFORMANCE -->
  <div class="section">
    <h3>Agent Performance</h3>
    <table>
      <thead>
        <tr>
          <th>Agent</th>
          <th>Total Leads</th>
          <th>Interested</th>
          <th>Joined</th>
          <th>Revenue</th>
          <th>Edit Name</th>
        </tr>
      </thead>
      <tbody id="agentTable"></tbody>
    </table>
  </div>

  <!-- BULK ASSIGN -->
  <div class="section">
    <h3>Bulk Assign Leads</h3>
    <select id="assignAgent"></select>
    <button onclick="bulkAssign()">Assign Selected</button>
  </div>

  <!-- LEADS TABLE -->
  <div class="section">
    <h3>All Leads</h3>
    <table>
      <thead>
        <tr>
          <th>Select</th>
          <th>Name</th>
          <th>Phone</th>
          <th>Agent</th>
          <th>Status</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody id="leadTable"></tbody>
    </table>
  </div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyB7xfwR2gBijRnVaasu_DZKuY8gLifimH0",
  authDomain: "dashboard-bd51c.firebaseapp.com",
  projectId: "dashboard-bd51c",
  storageBucket: "dashboard-bd51c.firebasestorage.app",
  messagingSenderId: "689809644516",
  appId: "1:689809644516:web:75d6051b300983afb545f1"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let selectedLeads=[];

auth.onAuthStateChanged(user=>{
  if(!user){
    window.location.href="index.html";
  }else{
    loadStats();
    loadAgents();
    loadLeads();
  }
});

function loadStats(){
  db.collection("leads").onSnapshot(snapshot=>{
    let total=0, unassigned=0, interested=0, joined=0, revenue=0;

    snapshot.forEach(doc=>{
      const data=doc.data();
      total++;
      if(!data.assignedTo) unassigned++;
      if(data.status==="Interested") interested++;
      if(data.status==="Joined"){
        joined++;
        revenue += data.amount || 0;
      }
    });

    document.getElementById("total").innerText=total;
    document.getElementById("unassigned").innerText=unassigned;
    document.getElementById("interested").innerText=interested;
    document.getElementById("joined").innerText=joined;
    document.getElementById("revenue").innerText="₹"+revenue;
  });
}

function addLead(){
  const name=document.getElementById("name").value;
  const phone=document.getElementById("phone").value;
  const course=document.getElementById("course").value;

  if(!name || !phone){
    alert("Fill required fields");
    return;
  }

  db.collection("leads").add({
    studentName:name,
    phone:phone,
    course:course,
    status:"New",
    assignedTo:null,
    createdAt:new Date()
  });

  document.getElementById("name").value="";
  document.getElementById("phone").value="";
  document.getElementById("course").value="";
}

function loadAgents(){
  db.collection("users")
  .where("role","==","agent")
  .onSnapshot(snapshot=>{

    let html="";
    let dropdown="";

    snapshot.forEach(doc=>{
      const agentId=doc.id;
      const name=doc.data().name;

      dropdown+=`<option value="${agentId}">${name}</option>`;

      db.collection("leads")
      .where("assignedTo","==",agentId)
      .get()
      .then(leadSnap=>{

        let total=leadSnap.size;
        let interested=0;
        let joined=0;
        let revenue=0;

        leadSnap.forEach(lead=>{
          const data=lead.data();
          if(data.status==="Interested") interested++;
          if(data.status==="Joined"){
            joined++;
            revenue += data.amount || 0;
          }
        });

        html+=`
          <tr>
            <td>${name}</td>
            <td>${total}</td>
            <td>${interested}</td>
            <td>${joined}</td>
            <td>₹${revenue}</td>
            <td><button onclick="editName('${agentId}')">Edit</button></td>
          </tr>
        `;

        document.getElementById("agentTable").innerHTML=html;
      });
    });

    document.getElementById("assignAgent").innerHTML=dropdown;

  });
}

function loadLeads(){
  db.collection("leads").onSnapshot(snapshot=>{
    let html="";
    selectedLeads=[];

    snapshot.forEach(doc=>{
      const data=doc.data();
      html+=`
        <tr>
          <td><input type="checkbox" onchange="toggleSelect('${doc.id}',this)"></td>
          <td>${data.studentName}</td>
          <td>${data.phone}</td>
          <td>${data.assignedTo || "Unassigned"}</td>
          <td>${data.status}</td>
          <td>${data.amount || 0}</td>
        </tr>
      `;
    });

    document.getElementById("leadTable").innerHTML=html;
  });
}

function toggleSelect(id,checkbox){
  if(checkbox.checked){
    selectedLeads.push(id);
  }else{
    selectedLeads=selectedLeads.filter(l=>l!==id);
  }
}

function bulkAssign(){
  const agent=document.getElementById("assignAgent").value;
  if(!agent){
    alert("Select agent");
    return;
  }

  selectedLeads.forEach(id=>{
    db.collection("leads").doc(id).update({
      assignedTo:agent
    });
  });

  alert("Assigned Successfully");
}

function editName(agentId){
  let newName=prompt("Enter new name:");
  if(!newName) return;

  db.collection("users").doc(agentId).update({
    name:newName
  });
}

function logout(){
  auth.signOut().then(()=>{
    window.location.href="index.html";
  });
}

</script>

</body>
</html>
