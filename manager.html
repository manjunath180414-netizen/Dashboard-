

    <!DOCTYPE html>
<html>
<head>
  <title>HIS Academy - Manager Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    body{
      margin:0;
      font-family:Segoe UI, sans-serif;
      background:#0f172a;
      color:white;
    }

    header{
      padding:15px 20px;
      background:#1e293b;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .container{
      padding:20px;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
      gap:15px;
      margin-bottom:25px;
    }

    .card{
      background:#1e293b;
      padding:15px;
      border-radius:10px;
      text-align:center;
      cursor:pointer;
    }

    .card span{
      font-size:20px;
      font-weight:bold;
      display:block;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:15px;
      background:#1e293b;
      border-radius:10px;
      overflow:hidden;
    }

    th, td{
      padding:10px;
      border-bottom:1px solid #334155;
      text-align:center;
    }

    th{
      background:#111827;
    }

    select, button{
      padding:5px 8px;
      border:none;
      border-radius:5px;
      cursor:pointer;
    }

    button{
      background:#2563eb;
      color:white;
    }

  </style>
</head>

<body>

<header>
  <div>
    <h3>HIS Academy - Manager Dashboard</h3>
    <div id="welcome"></div>
  </div>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">

  <!-- SUMMARY -->
  <div class="stats">
    <div class="card"><span id="total">0</span>Total</div>
    <div class="card"><span id="unassigned">0</span>Unassigned</div>
    <div class="card"><span id="interested">0</span>Interested</div>
    <div class="card"><span id="followup">0</span>Follow Up</div>
    <div class="card"><span id="joined">0</span>Joined</div>
    <div class="card"><span id="revenue">₹0</span>Revenue</div>
  </div>

  <!-- AGENT PERFORMANCE -->
  <h3>Agent Performance</h3>
  <table>
    <thead>
      <tr>
        <th>Agent</th>
        <th>Assigned</th>
        <th>Interested</th>
        <th>Follow Up</th>
        <th>Joined</th>
        <th>Revenue</th>
      </tr>
    </thead>
    <tbody id="agentTable"></tbody>
  </table>

  <!-- BULK ASSIGN -->
  <h3>Bulk Assign</h3>
  <select id="agentSelect"></select>
  <button onclick="bulkAssign()">Assign Selected</button>
<h3>Percentage Based Distribution</h3>

<div id="percentageContainer" style="margin-bottom:20px;"></div>

<button onclick="distributeByPercentage()">Distribute Unassigned Leads</button>

<div id="distributionResult" style="margin-top:10px;color:#22c55e;"></div>
    
<h3>Upload CSV Leads</h3>

<div style="margin-bottom:20px;">
  <input type="file" id="csvFile" accept=".csv">
  <button onclick="uploadCSV()">Upload</button>
</div>

<div id="uploadResult" style="margin-bottom:20px;color:#22c55e;"></div>

<!-- ADD LEAD SECTION -->
<h3>Add New Lead</h3>

<div style="margin-bottom:20px; display:flex; gap:10px; flex-wrap:wrap;">
  <input type="text" id="newName" placeholder="Student Name" 
         style="padding:6px;border-radius:5px;border:none;">
  
  <input type="text" id="newPhone" placeholder="Phone" 
         style="padding:6px;border-radius:5px;border:none;">
  
  <input type="text" id="newCourse" placeholder="Course" 
         style="padding:6px;border-radius:5px;border:none;">
  
  <select id="newAssignAgent" 
          style="padding:6px;border-radius:5px;border:none;"></select>
  
  <button onclick="addLead()">Add Lead</button>
</div>

    
  <!-- LEADS TABLE -->
  <h3>All Leads</h3>
  <table>
    <thead>
      <tr>
        <th>Select</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Agent</th>
        <th>Status</th>
        <th>Amount</th>
        <th>FollowUp</th>
      </tr>
    </thead>
    <tbody id="leadTable"></tbody>
  </table>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyB7xfwR2gBijRnVaasu_DZKuY8gLifimH0",
  authDomain: "dashboard-bd51c.firebaseapp.com",
  projectId: "dashboard-bd51c",
  storageBucket: "dashboard-bd51c.firebasestorage.app",
  messagingSenderId: "689809644516",
  appId: "1:689809644516:web:75d6051b300983afb545f1"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let selectedLeads=[];

auth.onAuthStateChanged(user=>{
  if(!user){
    window.location.href="index.html";
  }else{
    db.collection("users").doc(user.uid).get().then(doc=>{
      if(!doc.exists || doc.data().role !== "manager"){
        window.location.href="index.html";
      }else{
        document.getElementById("welcome").innerText="Welcome, "+doc.data().name;
        loadAgents();
        loadLeads();
      }
    });
  }
});

function loadLeads(){

  db.collection("leads").onSnapshot(snapshot=>{

    let total=0, unassigned=0, interested=0, followup=0, joined=0, revenue=0;
    let html="";
    selectedLeads=[];

    snapshot.forEach(doc=>{
      const data=doc.data();
      total++;

      if(!data.assignedTo) unassigned++;
      if(data.status==="Interested") interested++;
      if(data.status==="Follow up") followup++;
      if(data.status==="Joined"){
        joined++;
        revenue += data.amount || 0;
      }

      let followTime = "--";
let remaining = 0;

if(data.followUpTime){
    remaining = Math.floor((data.followUpTime - Date.now()) / 1000);

    if(remaining > 0){
        let hrs = Math.floor(remaining/3600);
        let mins = Math.floor((remaining%3600)/60);
        let secs = remaining%60;

        followTime = 
          hrs.toString().padStart(2,"0")+":"+
          mins.toString().padStart(2,"0")+":"+
          secs.toString().padStart(2,"0");
    } else {
        followTime = "OVERDUE";
    }
}
startManagerTimer();


      html+=`
        <tr>
          <td><input type="checkbox" onchange="toggleSelect('${doc.id}',this)"></td>
          <td>${data.studentName}</td>
          <td>${data.phone}</td>
          <td>${data.assignedTo || "Unassigned"}</td>
          <td>${data.status || "New"}</td>
          <td>${data.amount || 0}</td>
          <td>${followTime}</td>
        </tr>
      `;
    });

    document.getElementById("leadTable").innerHTML=html;
    document.getElementById("total").innerText=total;
    document.getElementById("unassigned").innerText=unassigned;
    document.getElementById("interested").innerText=interested;
    document.getElementById("followup").innerText=followup;
    document.getElementById("joined").innerText=joined;
    document.getElementById("revenue").innerText="₹"+revenue;

    updateAgentPerformance(snapshot);

  });
}

function loadAgents(){

  db.collection("users")
  .where("role","==","agent")
  .get()
  .then(snapshot=>{

    let options="";
    let percentageHTML="";

    snapshot.forEach(doc=>{
      options+=`<option value="${doc.id}">${doc.data().name}</option>`;

      percentageHTML+=`
        <div style="margin-bottom:8px;">
          ${doc.data().name}
          <input type="number" 
                 id="percent_${doc.id}" 
                 placeholder="Enter %" 
                 style="width:80px;padding:5px;margin-left:10px;">
        </div>
      `;
    });

    document.getElementById("agentSelect").innerHTML=options;
    document.getElementById("newAssignAgent").innerHTML="<option value=''>Unassigned</option>"+options;
    document.getElementById("percentageContainer").innerHTML=percentageHTML;

  });
}

function addLead(){

  const name = document.getElementById("newName").value.trim();
  const phone = document.getElementById("newPhone").value.trim();
  const course = document.getElementById("newCourse").value.trim();
  const agent = document.getElementById("newAssignAgent").value;

  if(!name || !phone){
    alert("Name and Phone are required");
    return;
  }

  db.collection("leads").add({
    studentName: name,
    phone: phone,
    course: course || "",
    assignedTo: agent || null,
    status: "New",
    amount: 0,
    createdAt: Date.now()
  })
  .then(()=>{
    alert("Lead Added Successfully");

    document.getElementById("newName").value="";
    document.getElementById("newPhone").value="";
    document.getElementById("newCourse").value="";
  })
  .catch(err=>{
    alert("Error adding lead");
    console.error(err);
  });

}

function updateAgentPerformance(snapshot){

  db.collection("users")
  .where("role","==","agent")
  .get()
  .then(agentSnap=>{

    let html="";

    agentSnap.forEach(agent=>{
      let assigned=0, interested=0, followup=0, joined=0, revenue=0;

      snapshot.forEach(doc=>{
        let data=doc.data();
        if(data.assignedTo===agent.id){
          assigned++;
          if(data.status==="Interested") interested++;
          if(data.status==="Follow up") followup++;
          if(data.status==="Joined"){
            joined++;
            revenue+=data.amount||0;
          }
        }
      });

      html+=`
        <tr>
          <td>${agent.data().name}</td>
          <td>${assigned}</td>
          <td>${interested}</td>
          <td>${followup}</td>
          <td>${joined}</td>
          <td>₹${revenue}</td>
        </tr>
      `;
    });

    document.getElementById("agentTable").innerHTML=html;

  });
}
function startManagerTimer(){

    setInterval(()=>{
        const rows = document.querySelectorAll("#leadTable tr");

        rows.forEach(row=>{
            const followCell = row.cells[6]; // FollowUp column
            const timeText = followCell.innerText;

            if(timeText.includes(":")){
                let parts = timeText.split(":");
                let totalSeconds = 
                    parseInt(parts[0])*3600 +
                    parseInt(parts[1])*60 +
                    parseInt(parts[2]);

                totalSeconds--;

                if(totalSeconds <= 0){
                    followCell.innerText = "OVERDUE";
                    row.style.background = "rgba(239,68,68,0.2)";
                } else {
                    let hrs = Math.floor(totalSeconds/3600);
                    let mins = Math.floor((totalSeconds%3600)/60);
                    let secs = totalSeconds%60;

                    followCell.innerText =
                      hrs.toString().padStart(2,"0")+":"+
                      mins.toString().padStart(2,"0")+":"+
                      secs.toString().padStart(2,"0");

                    if(totalSeconds <= 1800){
                        row.style.background = "rgba(251,191,36,0.15)";
                    }
                }
            }
        });

    },1000);
}

function toggleSelect(id,checkbox){
  if(checkbox.checked){
    selectedLeads.push(id);
  }else{
    selectedLeads=selectedLeads.filter(l=>l!==id);
  }
}
function uploadCSV(){

  const file = document.getElementById("csvFile").files[0];

  if(!file){
    alert("Please select CSV file");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){

    const text = e.target.result;
    const rows = text.split("\n");

    if(rows.length < 2){
      alert("Invalid CSV file");
      return;
    }

    const headers = rows[0].toLowerCase().split(",");

    let nameIndex = -1;
    let phoneIndex = -1;

    headers.forEach((h,i)=>{
      if(h.includes("name")) nameIndex = i;
      if(h.includes("phone") || h.includes("mobile") || h.includes("number") || h.includes("contact")) phoneIndex = i;
    });

    if(nameIndex === -1 || phoneIndex === -1){
      alert("Could not detect Name or Phone column");
      return;
    }

    let uploaded = 0;
    let skippedInvalid = 0;
    let skippedDuplicate = 0;

    const batch = db.batch();

    const processRows = async () => {

      const existingNumbers = new Set();

      const snapshot = await db.collection("leads").get();
      snapshot.forEach(doc=>{
        if(doc.data().phone){
          existingNumbers.add(doc.data().phone);
        }
      });

      for(let i=1; i<rows.length; i++){

        const cols = rows[i].split(",");
        if(cols.length <= phoneIndex) continue;

        let name = cols[nameIndex]?.trim();
        let phone = cols[phoneIndex]?.trim();

        if(!name || !phone){
          skippedInvalid++;
          continue;
        }

        // Clean phone number
        phone = phone.replace(/\D/g,""); // remove non-digits
        if(phone.startsWith("91") && phone.length>10){
          phone = phone.slice(-10);
        }

        if(phone.length !== 10){
          skippedInvalid++;
          continue;
        }

        if(existingNumbers.has(phone)){
          skippedDuplicate++;
          continue;
        }

        const docRef = db.collection("leads").doc();

        batch.set(docRef,{
          studentName: name,
          phone: phone,
          course: "",
          assignedTo: null,
          status: "New",
          amount: 0,
          createdAt: Date.now()
        });

        existingNumbers.add(phone);
        uploaded++;
      }

      await batch.commit();

      document.getElementById("uploadResult").innerHTML = 
        "Uploaded: "+uploaded+
        " | Invalid: "+skippedInvalid+
        " | Duplicates Skipped: "+skippedDuplicate;

      document.getElementById("csvFile").value="";
    };

    processRows();

  };

  reader.readAsText(file);
}
function bulkAssign(){

  if(selectedLeads.length === 0){
    alert("No leads selected");
    return;
  }

  const agentId = document.getElementById("agentSelect").value;

  if(!agentId){
    alert("Select an agent");
    return;
  }

  const batch = db.batch();

  selectedLeads.forEach(id=>{
    const ref = db.collection("leads").doc(id);
    batch.update(ref,{
      assignedTo: agentId,
      updatedAt: Date.now()
    });
  });

  batch.commit().then(()=>{
    alert("Assigned Successfully");
    selectedLeads = [];
  });

}
    function logout(){
  auth.signOut().then(()=>{
    window.location.href="index.html";
  });
}



</script>
</body>
</html>
