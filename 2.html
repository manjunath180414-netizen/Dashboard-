<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Info Team Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f4f6f9;
}
.header{
    background:#2a5298;
    color:white;
    padding:15px;
    display:flex;
    justify-content:space-between;
}
.container{
    padding:25px;
}
.card{
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    max-width:600px;
    margin:auto;
    text-align:center;
}
button{
    padding:10px 15px;
    border:none;
    border-radius:6px;
    margin:5px;
    cursor:pointer;
}
select, input{
    padding:8px;
    margin:5px;
}
</style>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>

<body>

<div class="header">
<h3>Info Team Panel</h3>
<div>
Welcome <b id="agentName"></b>
<button onclick="logout()">Logout</button>
</div>
</div>

<div class="container">

<div class="card" id="leadCard">
<h3 id="studentName">Loading...</h3>
<p id="studentPhone"></p>

<button onclick="copyNumber()">Copy & Call</button>

<br><br>

<select id="statusSelect">
<option value="">Select Status</option>
<option value="Interested">Interested</option>
<option value="Payment Doing Now">Payment Doing Now</option>
<option value="Not Interested">Not Interested</option>
<option value="Joined">Joined</option>
</select>

<br>

<div id="amountSection" style="display:none;">
<input type="number" id="amountInput" placeholder="Enter Amount">
</div>

<br>

<button onclick="updateStatus()">Submit</button>

</div>

</div>

<script>

// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyB7xfwR2gBijRnVaasu_DZKuY8gLifimH0",
  authDomain: "dashboard-bd51c.firebaseapp.com",
  projectId: "dashboard-bd51c",
  storageBucket: "dashboard-bd51c.firebasestorage.app",
  messagingSenderId: "689809644516",
  appId: "1:689809644516:web:75d6051b300983afb545f1"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let agentUID = null;
let currentLeadId = null;
let currentPhone = null;

// Auth Check
auth.onAuthStateChanged(user=>{
    if(!user){
        window.location.href="index.html";
        return;
    }

    agentUID = user.uid;

    db.collection("users").doc(agentUID).get().then(doc=>{
        if(!doc.exists || doc.data().role !== "info"){
            alert("Access Denied");
            auth.signOut();
            window.location.href="index.html";
            return;
        }

        document.getElementById("agentName").innerText = doc.data().name;
        loadNextLead();
    });
});

// Load Next Lead
function loadNextLead(){

    db.collection("leads")
    .where("stage","==","info")
    .limit(1)
    .get()
    .then(snapshot=>{
        if(snapshot.empty){
            document.getElementById("leadCard").innerHTML =
            "<h3>No Leads Available</h3>";
            return;
        }

        const doc = snapshot.docs[0];
        const data = doc.data();

        currentLeadId = doc.id;
        currentPhone = data.phone;

        document.getElementById("studentName").innerText =
        data.studentName || "No Name";

        document.getElementById("studentPhone").innerText =
        data.phone;
    });
}

// Copy Number
function copyNumber(){
    navigator.clipboard.writeText(currentPhone);
    alert("Number Copied");
}

// Show amount if Joined selected
document.getElementById("statusSelect").addEventListener("change", function(){
    if(this.value === "Joined"){
        document.getElementById("amountSection").style.display = "block";
    } else {
        document.getElementById("amountSection").style.display = "none";
    }
});

// Update Status
function updateStatus(){

    const status = document.getElementById("statusSelect").value;

    if(!status){
        alert("Select Status");
        return;
    }

    let updateData = {
        status: status,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    if(status === "Interested" || status === "Payment Doing Now"){
        updateData.stage = "whatsapp";
    }

    if(status === "Not Interested"){
        updateData.stage = "closed";
    }

    if(status === "Joined"){
        const amount = document.getElementById("amountInput").value;
        if(!amount){
            alert("Enter Amount");
            return;
        }
        updateData.amount = parseInt(amount);
        updateData.stage = "closed";
    }

    db.collection("leads").doc(currentLeadId)
    .update(updateData)
    .then(()=>{
        document.getElementById("statusSelect").value="";
        document.getElementById("amountInput").value="";
        document.getElementById("amountSection").style.display="none";
        loadNextLead();
    });
}

function logout(){
    auth.signOut().then(()=>{
        window.location.href="index.html";
    });
}

</script>

</body>
</html>
